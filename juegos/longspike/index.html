/* ---------- física del balón (compartida con la simulación) ---------- */
function pasoBalon(b,dt,W,fx){
  if(W.x<b.x+2500)extiende(W,b.x+4000);techo(b);
  var i,o,z=zonaDe(b.x),bg=BG[z.k],px=b.x,py=b.y,m=1+0.12*(b.cad||0);
  if(b.carry>0){var pc=b.pel;b.carry-=dt;pc.x+=320*dt;pc.y+=40*dt;b.x=pc.x+10;b.y=pc.y-16;b.vx=320;b.vy=40;
    if(b.carry<=0){b.vx=Math.max(360,b.vin||0)*m;b.vy=110;pc.gone=true;b.carry=0;fx('suelta',b,pc);}return;}
  var ax=b.y>R_BALL+1?WIND:0;
  for(i=0;i<W.ob.length;i++){o=W.ob[i];if(o.tp==='abanico'&&b.x>o.x+o.w&&b.x<o.x+o.w+150&&b.y<170&&b.y>R_BALL+1)ax+=0.6*b.v0;}
  b.vx+=ax*dt;b.vx*=(1-0.02*dt);b.vy-=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y>430&&b.vy>0)b.vy*=0.92;

    else if((o.tp==='carro'||o.tp==='guagua'||o.tp==='bote')&&inx){var top=o.h*(o.tp==='guagua'?0.93:o.tp==='bote'?0.62:0.86),big=o.tp!=='carro';
      if(py-R_BALL>=top-4&&b.y-R_BALL<top&&b.vy<0){b.y=top+R_BALL;b.vy=(Math.abs(b.vy)*0.75+(big?0.16:0.13)*b.v0)*Math.sqrt(m);b.vx=b.vx*(big?1.12:1.06)+0.03*b.v0*m;o.anim=1;cadena(b,fx);fx(o.tp==='bote'?'barco':o.tp,b,o);}

    else if(o.tp==='surf'&&inx&&b.y<R_BALL+6&&!o.used){o.used=true;b.vx+=0.3*b.v0*m;b.vy=60;cadena(b,fx);fx('surf',b,o);}
    else if(o.tp==='charco'&&inx&&b.y<R_BALL+3&&!o.used){o.used=true;if(b.escudo>0){b.escudo--;fx('escudo',b,o);}else{b.vx*=0.55;b.vy=Math.min(Math.abs(b.vy)*0.3,60);fx('charco',b,o);}}
    else if(o.tp==='cono'&&inx&&b.y-R_BALL<o.h&&!o.used){o.used=true;o.cae=1;b.vx*=0.6;b.vy=Math.max(b.vy,0)+150;fx('cono',b,o);}
    else if(o.tp==='red'&&!b.caught&&!o.roto&&b.x>o.x+6&&b.x<o.x+o.w-6&&b.y<o.h*0.86){if(b.escudo>0){b.escudo--;o.roto=true;fx('escudo',b,o);}else{b.caught=true;b.vx*=0.08;b.vy=Math.min(b.vy,0)*0.2;fx('red',b,o);}}

function botaActivo(b){var q=b.act;b.act=null;b.ultAct=q;
