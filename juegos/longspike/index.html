/* ---------- STATION / Angels: records del equipo (igual que 0.5.8) ---------- */

function rnd(a,b){return a+Math.random()*(b-a);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){t=clamp(t,0,1);return t*t*(3-2*t);}
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* medidas de las imagenes de 0.5.8 (ancho, alto en pixeles): de ellas salen el alto y el ancho de choque */
var DIMS={trampolin:[240,79],abanico:[106,220],carro:[360,178],guagua:[560,187],surf:[300,61],cono:[72,110],red:[300,193],bote:[340,104],pelicano:[300,220],botella:[29,80],moneda:[64,66],balon:[96,97]};
function sw(nm,w){var d=DIMS[nm];if(!d)return {w:w,h:w};return {w:w,h:w*d[1]/d[0]};}
function swh(nm,h){var d=DIMS[nm];if(!d)return {w:h,h:h};return {w:h*d[0]/d[1],h:h};}

/* ---------- mundo del día ---------- */
// 0.5.5: unos 20 pelicanos por partida (1 de cada 4 malo, se lleva el balon
// para atras), carros azules como en 0.5.4 (uno de cada 8 en el estacionamiento,
// ninguno en la calle; nunca dos seguidos y maximo 2 por partida) y 1 de cada 3 guaguas con la puerta de atras abierta.
// 0.5.8: ninguna guagua entre los 690 y 750 m (la de antes de los 750 m paraba la bola).
var MALO=0.25,ABIERTA=0.33;
var TIPOS={gradas:['trampolin','abanico','cono','trampolin','pelicano'],estac:['carro','trampolin','charco','cono','pelicano','cono','trampolin','pelicano'],
  calle:['guagua','charco','charco','cono','pelicano','trampolin','guagua','cono','pelicano'],playa:['surf','red','pelicano','surf','charco','surf'],
  muelle:['bote','trampolin','pelicano','bote','cono','trampolin'],mar:['bote','pelicano','bote','surf']};
function nuevoObj(tp,x,R){var o={tp:tp,x:x},s;
  if(tp==='trampolin'){s=sw('trampolin',56);}else if(tp==='abanico'){s=swh('abanico',66);}else if(tp==='carro'){s=sw('carro',92);}
  else if(tp==='guagua'){s=sw('guagua',190);o.abierta=R()<ABIERTA;}else if(tp==='surf'){s=sw('surf',80);}else if(tp==='cono'){s=swh('cono',26);}
  else if(tp==='red'){s=sw('red',66);}else if(tp==='bote'){s=sw('bote',110);}else if(tp==='pelicano'){s=sw('pelicano',64);o.y=55+R()*120;o.bx=x;o.ph=R()*6;o.malo=R()<MALO;}
  else{s={w:58,h:6};}
  o.w=s.w;o.h=s.h;return o;}
function extiende(W,hasta){var R=W.R;
  while(W.x<hasta){var z=zonaDe(W.x),l=TIPOS[z.k];if(!l){W.x+=200;continue;}var tp=l[Math.floor(R()*l.length)];
    if(tp==='carro'&&((W.nc||0)>=2||(W.ob.length&&W.ob[W.ob.length-1].tp==='carro'))){var l2=l.filter(function(t){return t!=='carro';});tp=l2[Math.floor(R()*l2.length)];}
    var o=nuevoObj(tp,W.x,R);
    if(z.k!==zonaDe(W.x+o.w+20).k){W.x+=80;continue;}if(!(o.tp==='guagua'&&o.x>=6900&&o.x<7500))W.ob.push(o);if(o.tp==='carro')W.nc=(W.nc||0)+1;var esp=z.k==='mar'?210:z.k==='muelle'?170:140;W.x+=esp+R()*220;}
  while(W.cx<hasta){var n=4+Math.floor(R()*4),y0=30+R()*140,amp=15+R()*35,i;
    for(i=0;i<n;i++)W.co.push({x:W.cx+i*22,y:y0+Math.sin(i/(n-1)*Math.PI)*amp,tp:'mon',ph:i*0.5});
    if(R()<0.22)W.co.push({x:W.cx+n*22+30,y:y0+amp+30,tp:'bot',ph:0});
    W.cx+=n*22+130+R()*280;}
  if(W.ob.length>400){var lim=hasta-6000;W.ob=W.ob.filter(function(o){return o.x>lim;});W.co=W.co.filter(function(c){return c.x>lim;});}}
function mundo(sd){var W={ob:[],co:[],R:mul(sd||SEED),x:700,cx:150};extiende(W,3500);return W;}

/* ---------- física del balón (compartida con la simulación) ---------- */
function pasoBalon(b,dt,W,fx){
  if(W.x<b.x+2500)extiende(W,b.x+4000);techo(b);
  var i,o,z=zonaDe(b.x),bg=BG[z.k],px=b.x,py=b.y,m=1+0.12*(b.cad||0);
  if(b.bus){var u=b.bus;b.vx=Math.min(1300,b.vx+700*dt);b.x+=b.vx*dt;b.y=u.h*0.54;b.vy=0;
    if(b.x>=u.x+u.w+R_BALL){b.bus=null;b.x=u.x+u.w+R_BALL;b.vx=Math.min(1300,Math.max((b.vin||0)*1.35,450)*m);b.vy=90;techo(b);cadena(b,fx);fx('turbo',b,u);}return;}
  if(b.carry>0){var pc=b.pel,dm=pc.malo?-1:1;b.carry-=dt;pc.x+=320*dm*dt;pc.y+=40*dt;b.x=pc.x+(pc.malo?pc.w-10:10);b.y=pc.y-16;b.vx=320*dm;b.vy=40;
    if(b.carry<=0){if(pc.malo){b.vx=40;b.vy=20;var tr=nuevoObj('trampolin',b.x-10,Math.random);tr.premio=true;tr.anim=1;W.ob.push(tr);}else{b.vx=Math.max(360,b.vin||0)*m;b.vy=110;}pc.gone=true;b.carry=0;fx('suelta',b,pc);}return;}
  var ax=b.y>R_BALL+1?WIND:0;
  for(i=0;i<W.ob.length;i++){o=W.ob[i];if(o.tp==='abanico'&&b.x>o.x+o.w&&b.x<o.x+o.w+150&&b.y<170&&b.y>R_BALL+1)ax+=0.6*b.v0;}
  b.vx+=ax*dt;b.vx*=(1-0.02*dt);b.vy-=G*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.y>430&&b.vy>0)b.vy*=0.92;
  for(i=0;i<W.ob.length;i++){o=W.ob[i];var inx=b.x+R_BALL>o.x&&b.x-R_BALL<o.x+o.w;
    if(o.tp==='trampolin'&&inx&&b.y-R_BALL<o.h&&py-R_BALL>=o.h-6&&b.vy<0){b.y=o.h+R_BALL;b.vy=Math.max(-b.vy*0.9,(0.42*b.v0+0.1*Math.abs(b.vx))*m);b.vx=b.vx*1.04+0.05*b.v0*m;o.anim=1;cadena(b,fx);
      if(o.premio){o.premio=false;b.vx=Math.min(1300,Math.max(b.vx,(b.vin||0)*0.75,350));b.vy=Math.max(b.vy,240);techo(b);fx('premio',b,o);}else fx('trampolin',b,o);}
    else if(o.tp==='trampolin'&&inx&&!o.lanzo&&b.y-R_BALL<o.h&&b.vx>40){o.lanzo=true;b.y=o.h+R_BALL;b.vy=Math.min(560,140+0.55*Math.abs(b.vx))*Math.sqrt(m);b.vx=b.vx*1.02;o.anim=1;cadena(b,fx);fx('rampa',b,o);}
    else if((o.tp==='carro'||o.tp==='guagua'||o.tp==='bote')&&inx){var top=o.h*(o.tp==='guagua'?0.93:o.tp==='bote'?0.62:0.86),big=o.tp!=='carro';
      if(py-R_BALL>=top-4&&b.y-R_BALL<top&&b.vy<0){b.y=top+R_BALL;b.vy=(Math.abs(b.vy)*0.75+(big?0.16:0.13)*b.v0)*Math.sqrt(m);b.vx=b.vx*(big?1.12:1.06)+0.03*b.v0*m;o.anim=1;cadena(b,fx);fx(o.tp==='bote'?'barco':o.tp,b,o);}
      else if(o.abierta&&px+R_BALL<=o.x+3&&b.vx>0&&b.y>o.h*0.28+2&&b.y<o.h*0.80-2){b.bus=o;b.x=o.x;b.y=o.h*0.54;b.vin=b.vx;b.vx=Math.max(b.vx,300);b.vy=0;o.anim=1;fx('entra',b,o);}
      else if(b.y-R_BALL<top-4&&px+R_BALL<=o.x+3&&b.vx>0){b.x=o.x-R_BALL;b.vx*=0.55;b.vy=Math.max(b.vy,0)+Math.min(260,top*4.5);fx('choque',b,o);}}
    else if(o.tp==='surf'&&inx&&b.y<R_BALL+6&&!o.used){o.used=true;b.vx+=0.3*b.v0*m;b.vy=60;cadena(b,fx);fx('surf',b,o);}
    else if(o.tp==='charco'&&inx&&b.y<R_BALL+3&&!o.used){o.used=true;if(b.escudo>0){b.escudo--;fx('escudo',b,o);}else{b.vx*=0.55;b.vy=Math.min(Math.abs(b.vy)*0.3,60);fx('charco',b,o);}}
    else if(o.tp==='cono'&&inx&&b.y-R_BALL<o.h&&!o.used){o.used=true;o.cae=1;b.vx*=0.6;b.vy=Math.max(b.vy,0)+150;fx('cono',b,o);}
    else if(o.tp==='red'&&!b.caught&&!o.roto&&b.x>o.x+6&&b.x<o.x+o.w-6&&b.y<o.h*0.86){if(b.escudo>0){b.escudo--;o.roto=true;fx('escudo',b,o);}else{b.caught=true;b.vx*=0.08;b.vy=Math.min(b.vy,0)*0.2;fx('red',b,o);}}
    else if(o.tp==='pelicano'&&!o.gone&&Math.abs(b.x-(o.x+o.w/2))<24&&Math.abs(b.y-o.y)<20){b.carry=o.malo?1.0:1.4;b.pel=o;b.vin=Math.abs(b.vx);if(o.malo){b.cad=0;fx('pelmalo',b,o);}else{cadena(b,fx);fx('pelicano',b,o);}}}
  if(b.y<R_BALL&&bg.agua&&!b.hundido){b.y=R_BALL;if(b.act||(Math.abs(b.vx)>200&&b.vy<-20)){if(b.act){botaActivo(b);fx('activo',b,null);}else{b.vy=Math.abs(b.vy)*0.55+70;b.vx*=0.9;}b.cad=0;fx('agua',b,bg);}else{b.hundido=true;b.vx=0;b.vy=0;fx('hunde',b,bg);}return;}
  if(b.hundido){b.y=R_BALL;b.vx=0;b.vy=0;return;}
  if(b.y<R_BALL){b.y=R_BALL;
    if(b.vy<-38){if(b.act){botaActivo(b);fx('activo',b,null);}else{b.vy=-b.vy*bg.bounce;b.vx*=bg.keep;fx('bote',b,bg);}if(b.cad)b.cad=0;}
    else{b.act=null;b.vy=0;var f=bg.fr*dt;b.vx=Math.abs(b.vx)<=f?0:b.vx-Math.sign(b.vx)*f;}}
}
// Bote activo (0.5.0): perfecto = rebote alto y conserva el 95 % de la
// velocidad; bien = rebote medio y el 85 %.
function botaActivo(b){var q=b.act;b.act=null;b.ultAct=q;
  var v=Math.abs(b.vx);if(q==='perfect'){b.vy=Math.max(Math.abs(b.vy)*0.9,Math.min(380,0.6*v));b.vx*=0.95;}else{b.vy=Math.max(Math.abs(b.vy)*0.6,Math.min(250,0.4*v));b.vx*=0.85;}}
var VYMAX=480;
function techo(b){if(b.vy>VYMAX)b.vy=VYMAX;}
function cadena(b,fx){b.cad=(b.cad||0)+1;if(b.cad>=2)fx('cadena',b,null);}
function simula(v0,ang,sd){var W=mundo(sd),b={x:8,y:120,vx:Math.cos(ang*Math.PI/180)*v0,vy:Math.sin(ang*Math.PI/180)*v0,carry:0,v0:v0},t=0;techo(b);
  while(t<120){pasoBalon(b,1/120,W,function(){});t+=1/120;if(b.y<=R_BALL+0.5&&Math.abs(b.vx)<8&&!b.carry)break;}
  return Math.round(b.x/PX_M);}

function mezcla(a,b,t){var r={},k;for(k in a)r[k]=lerp(a[k],b[k],t);return r;}
function correr(ph,brazos){var s=Math.sin(ph),c=Math.cos(ph);
  var p={lean:26,hF:38*s,kF:-12-62*Math.max(0,-c),hB:-38*s,kB:-12-62*Math.max(0,c),sN:-48*s,eN:30,sF:48*s,eF:30,h:-3+Math.abs(c)*3};
  if(brazos>0)p=mezcla(p,POSE.brazosAtras,brazos);return p;}
function vec(a,l){var r=a*Math.PI/180;return {x:Math.sin(r)*l,y:-Math.cos(r)*l};}
function cuerpo(p,x,y){var hip={x:x,y:y+34+p.h},sh={x:hip.x+Math.sin(p.lean*Math.PI/180)*24,y:hip.y+Math.cos(p.lean*Math.PI/180)*24};
  var u=vec(p.sN,13),el={x:sh.x+u.x,y:sh.y+u.y},f=vec(p.sN+p.eN,12),hand={x:el.x+f.x,y:el.y+f.y};
  return {hip:hip,sh:sh,el:el,hand:hand};}

  else if(k==='red'){txt(b.x,b.y+30,'Caught in the net',TINTA);snd(110,0.5,'sawtooth');SHK=3;}

  DPR=Math.min(window.devicePixelRatio||1,QL>=3?2:QL===2?1.6:1.25);renderer.setPixelRatio(DPR);renderer.setSize(PW,PH,false);cv.style.width=PW+'px';cv.style.height=PH+'px';
  if(composer){composer.setPixelRatio(DPR);composer.setSize(PW,PH);if(bloom)bloom.resolution.set(Math.round(PW*DPR/2),Math.round(PH*DPR/2));}
  camera.aspect=ASP;camera.updateProjectionMatrix();
  lcv.width=Math.round(PW*DPR);lcv.height=Math.round(PH*DPR);lcv.style.width=PW+'px';lcv.style.height=PH+'px';SWv=PW;SHv=PH;
  /* la logica usa VW para adelantar la camara al balon y para las lineas de velocidad (nada de la fisica) */
  VW=Math.max(VH*ASP,300);}catch(e){}}
function calidad(ms){try{FTS.push(ms);if(FTS.length<90)return;FTS.sort(function(a,b){return a-b;});var med=FTS[45];FTS.length=0;if(qWait>0){qWait--;return;}
  if(med>19&&QL>1){QL--;qAplica();qWait=2;}else if(med<12.5&&QL<QMAX){QL++;qAplica();qWait=4;}}catch(e){}}
function qAplica(){try{if(QL>=2)compBuild();sun.castShadow=QL>=2;sun.shadow.mapSize.set(QL>=3?2048:1024,QL>=3?2048:1024);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}size();}catch(e){}}
var CAMDBG=null;
/* un paso: la logica de siempre (step con el mismo dt de 0.5.8) y despues todo lo que se ve */
function tick(dt){if(!S)return;
  if(BOT.on||DEMO)botPaso();
  step(dt);
  /* como en 0.5.8: mientras el colocador tiene el balon, el balon esta en sus manos (de aqui sale la colocacion) */
  if(S.ball.held){var Jc=cuerpo(POSE.colListo,SETX,0);S.ball.x=SETX-(Jc.hand.x-SETX)-1;S.ball.y=Jc.hand.y+6;}
  TT+=dt;
  if(S.fase==='vuelo'&&S.ball.y>ST.hmax)ST.hmax=S.ball.y;
  if(DEMO&&S.fase==='fin'&&TT>DEMO_END)demoNuevo();
  rematadorUpdate();colocadorUpdate();
  camUpdate(dt);
  var cx=CAMS.l.x;atmUpdate(cx);tramosUpdate(cx);letrerosUpdate(cx);obsUpdate(cx);coinsUpdate(cx);
  balonUpdate(dt);impUpdate();flagsCheck();zcardUpdate(dt);partsUpdate(dt);popsUpdate();lineasUpdate();hudUpdate();ambUpdate();
  RIMU.value.setRGB(0.16,0.14,0.1);
  $('flash').style.opacity=Math.min(0.55,(S.flash||0)*0.6).toFixed(3);
  var sm=S.ts<0.7?(0.7-S.ts):0;renderer.toneMappingExposure=ATMO.ex*(1-sm*0.32);if(bloom)bloom.strength=0.42+sm*0.6;
  if(ESPUMA)ESPUMA.material.opacity=0.6+Math.sin(TT*1.3)*0.25;}
function render(rdt){if(composer&&QL>=2)composer.render(rdt);else renderer.render(scene,camera);}
function frame(now){var rdt=Math.min(0.1,Math.max(0,(now-last)/1000));last=now;
  try{if(ready&&!PAUSA&&!HOLD)tick(Math.min(0.04,rdt));
    if(ready&&!HOLD){if(CAMDBG)camAplicaDbg();render(rdt);if(rdt<0.05&&!DEMO)calidad(rdt*1000);}}catch(e){if(window.console)console.error(e);}
  requestAnimationFrame(frame);}
function camAplicaDbg(){try{camera.position.set(CAMDBG.p[0],CAMDBG.p[1],CAMDBG.p[2]);camera.lookAt(CAMDBG.l[0],CAMDBG.l[1],CAMDBG.l[2]);if(CAMDBG.fov){camera.fov=CAMDBG.fov;camera.updateProjectionMatrix();}}catch(e){}}

/* presentacion de una partida nueva (la llama nuevo() de la logica) */
function presNuevo(){try{RS.distT=0;RS.distR=0;RS.lastX=MX(S.px);RS.dY=0;RS.rootY=0;CAMS.zoom=1;CAMS.zoomT=1;CAMS.zoomH=0;CAMS.kick=0;IMP.t=-9;ZC.k='cancha';CO.sube=0;BV.sq=0;for(var q=0;q<TEAMF.length;q++)TEAMF[q].ok=false;RS.uPlant0=AT.uP;RS.uCon0=AT.uC;BV.off.set(0,0,0);CAMS.init=false;SP.length=0;
  for(var i=0;i<OBV.length;i++){if(OBV[i].__g){quitaG(OBV[i].__g);OBV[i].__g=null;}}OBV.length=0;
  for(var j=0;j<BOTL.length;j++){if(BOTL[j].__b){quitaG(BOTL[j].__b);BOTL[j].__b=null;}}BOTL.length=0;
  ST.pb=0;ST.cad=0;ST.hmax=0;ST.tap=0;NETX=-1e9;BOT.tgt=BOT.jx=BOT.ct=BOT.bt=null;HUDs.d=-1;HUDs.z='';HUDs.man=-1;HUDs.esc=-1;HUDs.msg='~';HUDs.st='~';NETF=0;}catch(e){}}

/* =====================================================================
   CARGA
   ===================================================================== */
var loadN=0,loadT=0;function cargado(){loadN++;try{$('loadb').style.width=Math.round(loadN*100/Math.max(1,loadT))+'%';}catch(e){}}
function cargar(){var jobs=[];
  /* ataque, voleo y espera son indispensables; la carrera y la celebracion, si fallan, se reemplazan */
  Object.keys(CLIP_LIST).forEach(function(n){var C=CLIP_LIST[n],opc=n==='carrera_rapida'||n==='celebra_1'||n==='carrera_trote';loadT++;
    jobs.push(loadGLB((C.b==='6'?B6:B3)+'clips/'+n+'.glb').then(function(g){CL[n]=prepClip(n,g,C);cargado();},function(e){if(!opc)throw e;cargado();}));});
  loadT++;jobs.push(Promise.all([loadGLB(B3+'j7_half.glb'),loadTexNC(B3+'j7_mask.png')]).then(function(r){var b2=T3.cloneSkinned(r[0].scene);RM.setup(r[0].scene,r[1],CFG.kit);CO.setup(b2,r[1],CFG.kitS);cargado();}));
  return Promise.all(jobs);}
mundoBase();size();qAplica();requestAnimationFrame(frame);
cargar().then(function(){try{prepAtaque();flagsCarga();try{var ct=CL.carrera_trote;if(ct&&ct.hip){var dz=Math.abs(sampleHip(ct,ct.t1,2)-sampleHip(ct,ct.t0,2))*0.99/ct.restHipY;if(dz>1.2&&dz<6)RS.runLt=dz;}}catch(e2){}ready=true;$('load').style.opacity='0';setTimeout(function(){$('load').style.display='none';},450);
    if(BOTQ){arranca();BOT.on=true;}else inicio();window.LS_READY=true;}catch(e){if(window.console)console.error(e);}},
  function(e){try{if(window.console)console.error(e);$('loadm').textContent='Could not load the 3D game. Opening the classic version…';setTimeout(aClasico,1200);}catch(er){}});

/* ganchos de prueba */
window.LS={version:APP_VERSION,hold:function(v){HOLD=!!v;last=performance.now();},
  adv:function(sec,dt){dt=dt||1/60;var n=Math.max(1,Math.round(sec/dt));for(var i=0;i<n;i++)tick(dt);if(CAMDBG)camAplicaDbg();render(dt);var I=renderer.info.render;return {calls:I.calls,tris:I.triangles,fase:S.fase,m:Math.round(S.ball.x/PX_M),x:S.ball.x,y:S.ball.y};},
  state:function(){return S;},st:function(){return ST;},bot:BOT,at:function(){return AT;},rs:function(){return RS;},
  camDbg:function(o){CAMDBG=o||null;if(!o){CAMS.init=false;}},ql:function(v){if(v){QMAX=v;QL=v;qAplica();}return QL;},start:function(){arranca();},tap:function(){tap();},
  dbg:function(){var h=new V3(),b=new V3();if(RM.ok)RM.mano('RightHand',h);return {hand:[+h.x.toFixed(3),+h.y.toFixed(3)],ball:[+ball.position.x.toFixed(3),+ball.position.y.toFixed(3)],logicBall:[+MX(S.ball.x).toFixed(3),+MX(S.ball.y).toFixed(3)],u:RS.u,dY:RS.dY,rootY:RS.rootY,fase:S.fase,amb:ATMO,cu:CO.u};},
  flags:function(l){flagsPon(l);},cou:CO_U,world:function(){return W;},
  mira:function(x){CAMS.l.x=x;CAMS.p.x=x;atmUpdate(x);tramosUpdate(x);letrerosUpdate(x);S.fase='vuelo';obsUpdate(x);coinsUpdate(x);TT+=0.3;obsUpdate(x);sky.position.copy(camera.position);var sx=Math.round(x/2)*2;sun.target.position.set(sx,0,0);sun.position.set(sx+SUN_DIR.x*60,SUN_DIR.y*60,SUN_DIR.z*60);camAplicaDbg();sky.position.copy(camera.position);for(var ci=0;ci<CORD.length;ci++)if(CORD[ci])CORD[ci].position.x=camera.position.x*CORD[ci].userData.par;renderer.toneMappingExposure=ATMO.ex;render(0.016);},
  pose:function(n,u){var c=CL[n];if(!c)return false;clipPose(c,u,CO.pose);CO.apply(CO.pose);render(0.016);return true;}};
})();
