   desplazamiento funden su costura (mvLoop): en el ultimo 20% del tramo se mezcla con lo que el clip hacia justo antes de empezarlo
   (o, si el tramo empieza al inicio del clip, el primer 20% se mezcla con lo que sigue al final). */

/* ---------- PLAY: conexion directa entre los dos telefonos (WebRTC) ----------
   Supabase solo junta a los dos telefonos: por el canal de la sala viajan la oferta y la respuesta (unos 4 mensajes).
   Despues el partido va de telefono a telefono: un canal sin reintentos para la posicion y el ping, y uno confiable
   para todo lo demas. Si no conecta o se cae, el partido sigue por Supabase Realtime como siempre, sin hacer nada.
   Prendida en PLAY; en STATION y Angels solo con ?p2p=1. ?p2p=0 la apaga. No toca fisica, reglas ni balance. */

/* modo: 'pq' posicion y giro completo (camara), 'py' posicion y solo el giro en Y (jugadores: el juego escribe rotation.y y los otros
   dos ejes tienen que quedar en 0), 'p' solo posicion (balon y marcas del piso) */
function ipAdd(o,lim,modo){IPL.push({o:o,m:modo||'p',pp:new V3(),pq:new Q4(),cp:new V3(),cq:new Q4(),py:0,cy:0,lim:lim*lim});}
function ipSave(){for(var i=0;i<IPL.length;i++){var e=IPL[i];e.pp.copy(e.o.position);if(e.m==='pq')e.pq.copy(e.o.quaternion);else if(e.m==='py')e.py=e.o.rotation.y;}}
function ipRestore(){if(!ipOn)return;for(var i=0;i<IPL.length;i++){var e=IPL[i];e.o.position.copy(e.cp);if(e.m==='pq')e.o.quaternion.copy(e.cq);else if(e.m==='py')e.o.rotation.y=e.cy;}ipOn=false;}
function ipBlend(a){for(var i=0;i<IPL.length;i++){var e=IPL[i];e.cp.copy(e.o.position);if(e.m==='pq')e.cq.copy(e.o.quaternion);else if(e.m==='py')e.cy=e.o.rotation.y;
    if(e.cp.distanceToSquared(e.pp)>e.lim)continue;e.o.position.lerpVectors(e.pp,e.cp,a);
    if(e.m==='pq')e.o.quaternion.copy(e.pq).slerp(e.cq,a);else if(e.m==='py')e.o.rotation.y=e.py+wrapPi(e.cy-e.py)*a;}ipOn=true;}
function tick(rdt){TKN++;if(ENT.on){entStep(rdt);return;}if(freezeT>0){freezeT-=rdt;camUpdate(rdt,false);return;}
  keysToJoy();if(TUT.hold){if(TUT.hold==='cho'&&Math.abs(JX)>0.35)tutRelease();}else tutCheck();
  if(TUT.hold){tAll+=rdt;hudDt+=rdt;}else{TS+=(tsGoal-TS)*Math.min(1,rdt*14);step(rdt*TS,rdt);camUpdate(rdt,false);hudDt+=rdt;}}
function frame(now){var rdt=Math.min(0.1,Math.max(0,(now-last)/1000));last=now;
  try{if(ready&&!paused&&!HOLD){ipRestore();bvOut();var n=Math.round(rdt/H60),al=1;
      if(!(n>=1&&n<=3&&Math.abs(rdt-n*H60)<0.0025)){ACC+=rdt;n=Math.floor(ACC/H60+1e-6);ACC-=n*H60;if(n>4){n=4;ACC=0;}if(ACC<0)ACC=0;al=ACC/H60;}
      for(var i=0;i<n;i++){ipSave();tick(H60);}
      if(BVtg===tG&&!REP.on){_bsim.copy(ball.position);ball.position.copy(BVIS);bvSw=true;}
      if(REAL_VIS){if(!bvSw){_bsim.copy(ball.position);bvSw=true;}ball.position.y-=BALL_R-0.105;}
      if(hudDt>0){hudFrame(hudDt);hudDt=0;}crowdFrame(rdt);if(al<0.999)ipBlend(al);if(rdt<0.05)quality(rdt*1000);else gxLento();}
    if(!NOREND)gxDraw();if(ready){sndFrame(rdt);narrFrame();}}catch(e){if(window.console)console.error(e);}
  requestAnimationFrame(frame);}

/* ======================= CARGA ======================= */
var B3='/juegos/bareboru/3d/',B6='/juegos/bareboru6/3d/';
var CLIP_LIST={espera:{},espera_defensa:{},desplaza_lateral:{},desplaza_frente_atras:{},recibo_frente:{contact:0.4589},recibo_izq:{contact:0.5706},recibo_der:{contact:0.4654},
  plancha_frente:{contact:0.3964},defensa_rodilla:{contact:0.4776},voleo_frente:{contact:0.7179},devolucion:{contact:0.4507},
  ataque:{takeoff:0.5874,landing:0.7273,contact:0.6573},bloqueo_frente:{takeoff:0.5812,landing:0.7749,contact:0.6702},
  desplaza_def_lateral:{b6:1},desplaza_def_frente_atras:{b6:1},carrera_salto_corto:{b6:1},carrera_trote:{b6:1},carrera_rapida:{b6:1},
  saque_flotante:{contact:0.4983},saque_salto:{takeoff:0.6176,landing:0.739,contact:0.6875},celebra_1:{},celebra_2:{},lamenta_1:{},
  bloqueo_izq:{takeoff:0.7169,landing:0.8382,contact:0.75},bloqueo_der:{takeoff:0.5363,landing:0.7039,contact:0.6201},voleo_izq:{contact:0.5812},voleo_der:{contact:0.3},
  plancha_izq:{contact:0.3348},plancha_der:{contact:0.3012},celebra_3:{},lamenta_2:{},ataque_corto:{takeoff:0.4555,landing:0.6545,contact:0.5602,b6:1}};
function cargar(){var jobs=[],done=0,total=0,SRC={};
  function tick(){done++;$('load').textContent=L('Cargando la cancha… ','Loading the court… ')+Math.round(done*100/total)+'%';}
  Object.keys(CLIP_LIST).forEach(function(n){total++;jobs.push(loadGLB((CLIP_LIST[n].b6?B6:B3)+'clips/'+n+'.glb').then(function(g){CLIPS[n]=prepClip(n,g,CLIP_LIST[n]);tick();},function(e){if(CLIP_LIST[n].b6){tick();return;}throw e;}));});
  /* 0.9.0: la arena de la marca entra en la misma carga; si falla, el juego sigue con la arena dibujada por codigo */
  if(ARENA_ON){total++;jobs.push(Promise.all([gxArena(),loadTexC(B6+'arena/cancha_'+CFG.brand+'.webp').then(null,function(){return null;}),gxPisoLoad()]).then(function(r){arenaBuild(r[0],r[1],r[2]);tick();},function(e){try{console.warn('arena',e);}catch(e2){}tick();}));}
  /* 0.15.0: la luz de entorno del HDRI entra en la misma carga; si falla se queda la luz pintada */
  if(GX.motor&&GX.lv>=1&&GX.hdri){total++;jobs.push(gxEnvLoad().then(function(){tick();}));}
  ['j3','j5','j7'].forEach(function(id){total++;jobs.push(Promise.all([loadGLB(B3+id+'_half.glb'),loadTex(B3+id+'_mask.png'),loadGLB(B6+id+'_light.glb')]).then(function(r){
    var mat=null;r[0].scene.traverse(function(o){if(o.isMesh&&!mat)mat=o.material;});SRC[id]={full:r[0].scene,mask:r[1],light:r[2].scene,mat:mat};tick();}));});
  return Promise.all(jobs).then(function(){var BODY=['j3','j5','j7'];
    for(var t=0;t<2;t++)for(var i=0;i<3;i++){var s=SRC[BODY[i]],kit=t===0?CFG.kitUs:CFG.kitRival,a=new Avatar(t,i);
      a.addBody('full',T3.cloneSkinned(s.full),s.mask,kit,s.mat);a.addBody('light',T3.cloneSkinned(s.light),s.mask,kit,s.mat);a.use('full');TEAM[t].pl[i]=a;}});}
var PRMAX=Math.min(window.devicePixelRatio||1,2);PR=PRMAX;qBuild();
hudStatic();size();requestAnimationFrame(frame);
cargar().then(function(){ALL=TEAM[0].pl.concat(TEAM[1].pl);labelsMake();applyQ();gxStart();mvBuild();apBuild();jfInit();
  try{ipAdd(camera,6,'pq');ipAdd(ball,2.5,'p');ipAdd(ballShadow,2.5,'p');ipAdd(ctrlRing,1.2,'p');for(var qi=0;qi<ALL.length;qi++){ipAdd(ALL[qi].root,1.2,'py');ipAdd(ALL[qi].blob,1.2,'p');}
    var q0=parseInt(localStorage.getItem('bb3_q'),10);if(q0>0&&q0<=QMAX)qSet(q0);gxLadder();}catch(e){}zurMide();
  $('load').style.display='none';
  G={phase:'menu',tPh:0,serving:0};R={mode:['def','def'],F:null,next:null};setGoals();
  for(var i=0;i<ALL.length;i++){var p=ALL[i];p.x=p.gx;p.z=p.gz;p.fn=0;}
  ball.position.set(0.6,BALL_R,3.2);ready=true;menu();window.BB_READY=true;
  try{if(!HOLD)setTimeout(utLoad,1200);if(!HOLD)setTimeout(narrCat,1500);}catch(e){}
},function(e){if(window.console)console.error(e);$('load').textContent=L('No se pudo cargar el juego. Revisa tu conexión y ábrelo otra vez.','Could not load the game. Check your connection and open it again.');});

/* ganchos de prueba (robot que juega solo, para medir rallies y balance) */
window.BB={version:APP_VERSION,nom:function(){return SB.nom;},zurEs:function(i){return zurEs(TEAM[0].pl[i]);},salto:function(){return {s:SALTO,take:TAKE,blk:BLK_LEAD};},gx:function(){return GX;},gxSet:function(v){gxSet(v);return GX.lv;},all:function(){return ALL;},
  gxInfo:function(){try{return {lv:GX.lv,lv0:GX.lv0,top:GX.top,ui:GX.ui,un:GX.U?GX.U.length:0,pr:PR,prmax:PRMAX,qt:qTxt(),brillo:PP.on,refl:RF.on,alta:!!GX.alta,madera:!!GX.madera,arena:!!AR,calls:renderer.info.render.calls,tri:renderer.info.render.triangles};}catch(e){return null;}},
  q:function(v){if(v==='lock')QLOCK=true;else if(v==='auto')QLOCK=false;else if(typeof v==='number')qSet(v);return {i:qI,max:QMAX,pr:PR,body:qStep,lv:QLV};},qfeed:function(ms,n){for(var i=0;i<n;i++)quality(ms);return qI;},
  loop:function(ms){var t=last;for(var i=0;i<ms.length;i++){t+=ms[i];NOREND=true;var raf=window.requestAnimationFrame;window.requestAnimationFrame=function(){};try{frame(t);}finally{window.requestAnimationFrame=raf;}}return {acc:ACC,ip:ipOn,ticks:TKN};},
  dibuja:function(){gxDraw();},render:function(v){NOREND=!v;},net:NET,nLobby:function(){nLobby();},nCreate:function(c){nCreate(c);},nJoin:function(c){nJoin(c);},cam:function(a){CAMDBG=a||null;},hold:function(v){HOLD=!!v;last=performance.now();},adv:function(sec){ipRestore();bvOut();var n=Math.max(1,Math.round(sec*60));for(var i=0;i<n;i++){var rdt=1/60;freezeT=0;if(TUT.hold){if(TUT.hold==='cho'&&Math.abs(JX)>0.35)tutRelease();}else tutCheck();if(TUT.hold){hudFrame(rdt);continue;}TS+=(tsGoal-TS)*Math.min(1,rdt*14);step(rdt*TS,rdt);camUpdate(rdt,false);hudFrame(rdt);crowdFrame(rdt);}return ctxNow();},joy:function(x,z){JX=x;JZ=z;},state:function(){return {G:G,R:R,CTRL:CTRL,tG:tG,TS:TS,REP:REP};},bot:BOT,press:function(){actionPress();},
  start:function(diff,assist,tut){if(diff)PREF.diff=diff;PREF.assist=!!assist;ov.style.display='none';newMatch(!!tut);},tut:function(){return TUT;},
  sim:function(matches,diff,sd,skip,aim,assist,react){var out={wins:0,losses:0,rallies:0,contacts:0,pts:[0,0],secs:0,st:{a:0,b:0,c:0,d:0,att:0,kill:0,attErr:0,blocked:0,ace:0,blk:0,srvErr:0,aiAtt:0,aiKill:0,aiErr:0,dive:0,aiDive:0},hist:{}};BOT.react=react||0;
    PREF.diff=diff||'easy';PREF.assist=!!assist;BOT.on=true;BOT.sim=true;BOT.sd=sd==null?0.05:sd;BOT.skip=skip||0;BOT.aim=aim||'open';BOT.log=[];var snd=PREF.snd;PREF.snd=false;
    for(var m=0;m<matches;m++){newMatch(false);var t0=tG,guard=0;while(G.phase!=='end'&&guard<400000){freezeT=0;step(1/60,1/60);guard++;}
      if(G.sc[0]>G.sc[1])out.wins++;else out.losses++;out.pts[0]+=G.sc[0];out.pts[1]+=G.sc[1];out.secs+=tG-t0;out.rallies+=G.st.rallies;out.contacts+=G.st.contacts;for(var k in out.st)out.st[k]+=G.st[k];}
    BOT.log.forEach(function(c){var b=c>=8?'8+':(''+c);out.hist[b]=(out.hist[b]||0)+1;});
    BOT.on=false;BOT.sim=false;PREF.snd=snd;out.avgContacts=out.contacts/Math.max(1,out.rallies);out.avgSecs=out.secs/matches;menu();return out;}};
})();
