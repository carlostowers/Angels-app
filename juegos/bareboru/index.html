function prepClip(name,gltf,marks){var an=gltf.animations[0],rest={},restPos={};

function nRpc(fn,args,cb){try{if(!SBC){cb(null,'x');return;}SBC.schema('station').rpc(fn,args).then(function(r){if(r&&!r.error)cb(r.data,null);else cb(null,(r&&r.error&&r.error.message)||'error');},function(){cb(null,'red');});}catch(e){cb(null,'error');}}
function nOpen(chan,cb){try{var done=false;function fin(ok){if(done)return;done=true;cb(ok);}
  var RT=NET.rt||SBC;
  if(NET.test&&!NET.rt){var bc=new BroadcastChannel(chan);bc.onmessage=function(e){nRx(e.data);};NET.tx=function(m){if(NET.tdelay)setTimeout(function(){try{bc.postMessage(m);}catch(e){}},NET.tdelay);else bc.postMessage(m);};NET.close=function(){try{bc.close();}catch(e){}};setTimeout(function(){fin(true);},30);return;}
  var c=RT.channel(chan,{config:{broadcast:{self:false,ack:false}}});c.on('broadcast',{event:'m'},function(p){nRx(p&&p.payload);});
  NET.tx=function(m){try{c.send({type:'broadcast',event:'m',payload:m});}catch(e){}};NET.close=function(){try{RT.removeChannel(c);}catch(e){}};
  c.subscribe(function(st){if(st==='SUBSCRIBED')fin(true);else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT')fin(false);});setTimeout(function(){fin(false);},12000);}catch(e){cb(false);}}

    NET.role='guest';NET.code=r.code;NET.chan=r.chan;NET.opp=r.host;nOpen(r.chan,function(ok){NET.busy=false;if(!ok){nLeave(true);nLobbyMsg(nErr(''));return;}NET.lobby='joined';nLobbyMsg(L('Conectado con ','Connected to ')+nLabel(r.host)+L('. Empezando…','. Starting…'));
      var n=0;function hi(){n++;if(NET.on||NET.lobby!=='joined'){clearInterval(NET.helloT);NET.helloT=null;return;}if(n>25){clearInterval(NET.helloT);NET.helloT=null;nLeave(false);nLobbyMsg(L('Tu rival no respondió. Pídele que cree la sala otra vez.','Your opponent did not answer. Ask for a new room.'));return;}nSend('hello',{kit:MYKIT});}
      hi();NET.helloT=setInterval(hi,1000);});}

var appW=800,appH=400,ROT=false,joy=null,KEYS={};
/* toque robusto: en iPhone con la pantalla girada el clic nativo a veces no llega */
function tap(e,fn){if(!e)return;var t0=null,done=0;
  function run(ev){try{var n=Date.now();if(n-done<450)return;done=n;fn(ev);}catch(er){if(window.console)console.error(er);}}
  e.addEventListener('touchstart',function(ev){try{var t=ev.changedTouches[0];t0={x:t.clientX,y:t.clientY};}catch(er){t0=null;}},{passive:true});
  e.addEventListener('touchend',function(ev){try{var t=ev.changedTouches[0];if(t0&&Math.abs(t.clientX-t0.x)<16&&Math.abs(t.clientY-t0.y)<16){if(ev.cancelable)ev.preventDefault();ev.stopPropagation();run(ev);}t0=null;}catch(er){}},{passive:false});
  e.addEventListener('click',function(ev){try{ev.stopPropagation();}catch(er){}run(ev);});}
function ovOpen(){return ov.style.display==='flex';}
function toApp(ev){return ROT?{x:ev.clientY,y:window.innerWidth-ev.clientX}:{x:ev.clientX,y:ev.clientY};}
function actionPress(){if(!G||paused||!R)return;var e;if(REP.on){repEnd();return;}if(TUT.hold){if(TUT.hold==='cho')return;tutRelease();}
  if(G.phase==='pre'){if(G.serving===0&&G.tPh>0.6)startWindup();return;}
  if(G.phase==='windup'){if(G.serving===0&&R.srv.press==null){e=tG-(R.srv.tC-REC_LEAD);if(e>-0.6)R.srv.press=e;}return;}
  if(G.phase!=='live')return;var n=R.next,F=R.F,c=R.choose;
  if(c&&!c.made){if(c.seg){c.useSeg=!c.useSeg;sUi();}return;}
  if(!n||!F)return;
  if(n.team===0&&n.type==='first'){if(R.recv.press==null){e=F.t-(n.t-REC_LEAD);if(e>-0.7)R.recv.press=e;}return;}
  if(n.team===0&&n.type==='hit'&&R.att){if(R.att.jumped)userHit();else if(!R.att.late){e=F.t-R.att.tTake;if(e>-0.7)userJump(e);}return;}
  if(n.team===0&&(n.type==='set'||n.type==='emg')&&R.att&&!R.att.jumped&&R.att.preT==null){e=tG-(F.t0+n.t+TEMPO[R.att.tempo].t-TAKE);if(e>-0.7){R.att.preT=tG;sUi();}return;}
  if(n.team===1&&n.type==='hit'&&R.blkU&&!R.blkU.jumped){userBlockJump();return;}}
function secondaryPress(){if(!G||paused||!R)return;
  if(G.phase==='pre'&&G.serving===0){R.srv.type=R.srv.type==='float'?'jump':'float';sUi();return;}
  var A=R.att;if(G.phase==='live'&&A&&A.jumped&&!A.done){A.tip=!A.tip;if(A.tip){A.aim.z=Math.max(A.aim.z,-4.2);}sUi();}}
function joySet(dx,dy){var m=hyp(dx,dy),mx=46;if(m>mx){dx*=mx/m;dy*=mx/m;m=mx;}var k=$('joyK');k.style.transform='translate('+dx+'px,'+dy+'px)';
  if(m<7){JX=0;JZ=0;}else{var g=Math.min(1,(m-7)/(mx-12));JX=dx/m*g;JZ=dy/m*g;}}
function joyRest(){var j=$('joy');j.className='';j.style.left=(118+SAFE_L)+'px';j.style.top=(appH-112)+'px';$('joyK').style.transform='translate(0px,0px)';}

  else actionPress();}catch(e){}});

function keysToJoy(){if(joy||BOT.on)return;var x=(KEYS.ArrowRight||KEYS.KeyD?1:0)-(KEYS.ArrowLeft||KEYS.KeyA?1:0),z=(KEYS.ArrowDown||KEYS.KeyS?1:0)-(KEYS.ArrowUp||KEYS.KeyW?1:0),m=hyp(x,z)||1;JX=x/m;JZ=z/m;}

function ctxNow(){if(!G||!R||!G.sc)return 'wait';if(G.phase==='pre')return G.serving===0?'srv0':'wait';if(G.phase==='windup')return G.serving===0?(R.srv.press==null?'srv1':'wait'):'wait';if(G.phase!=='live')return 'wait';

  '<div class="foot"><a href="'+backHref()+'">'+L('Volver a ','Back to ')+CFG.app+'</a><span>VOLEII · by Carlos Torres</span></div></div>';ov.style.display='flex';

    vqLog({us:G.sc[0],them:G.sc[1],level:lvN,secs:secs,assist:ASSIST?1:0,pa:s.a,pb:s.b,pc:s.c,pd:s.d,att:s.att,kill:s.kill,atterr:s.attErr,blocked:s.blocked,ace:s.ace,blk:s.blk,srverr:s.srvErr,rallies:s.rallies,contacts:s.contacts,perf:s.perf,taps:s.taps});
    if(!ASSIST)vqEnvia(sc,meta,function(r){try{var e=$('recm');if(e)e.textContent=r?(r.record?L('Marca nueva: ','New best: '):L('Tu mejor marca: ','Your best: '))+Number(r.best).toLocaleString('es-PR'):L('No se pudo guardar la marca.','Could not save your score.');vqTop(function(d){var t=$('tope');if(t&&d)t.innerHTML=topHTML(d);});}catch(e3){}});}}catch(e4){}}

/* ======================= TAMANO Y CAMARA ======================= */
var SAFE_L=0,CAMDBG=null,PR=1,shakeA=0,fovKick=0,baseFov=36,CAMP=new V3(0,9,19),CAML=new V3(0,1,-1);
function size(){var W=window.innerWidth,H=window.innerHeight;ROT=H>W;appW=ROT?H:W;appH=ROT?W:H;
  app.style.width=appW+'px';app.style.height=appH+'px';app.style.transform=ROT?'translate('+W+'px,0px) rotate(90deg)':'none';app.className=ROT?'rot':'';
  try{var pr=$('safe'),cs=getComputedStyle(pr),it=parseFloat(cs.paddingTop)||0,ib=parseFloat(cs.paddingBottom)||0,il=parseFloat(cs.paddingLeft)||0,ir=parseFloat(cs.paddingRight)||0;
    app.style.setProperty('--sl',(ROT?it:il)+'px');app.style.setProperty('--sr',(ROT?ib:ir)+'px');SAFE_L=ROT?it:il;}catch(e){}
  renderer.setPixelRatio(PR);renderer.setSize(appW,appH,true);var asp=appW/appH;camera.aspect=asp;
  /* mismo ancho de cancha en cualquier pantalla: el campo horizontal manda */
  var hf=2*Math.atan(Math.tan(47*Math.PI/360)*2.05);baseFov=clamp(2*Math.atan(Math.tan(hf/2)/asp)*180/Math.PI,40,64);camera.fov=baseFov;camera.updateProjectionMatrix();
  if(!joy)joyRest();camUpdate(0,true);}
/* camara de transmision desde nuestro fondo: sigue al balon con suavidad y se queda quieta en las camaras lentas de decision */
/* camara que sigue la jugada de cerca: detras de tu jugador en nuestro lado, se adelanta cuando el balon cruza y sube para apuntar el remate */
function camUpdate(rdt,snap){if(CAMDBG){camera.position.set(CAMDBG[0],CAMDBG[1],CAMDBG[2]);camera.lookAt(CAMDBG[3],CAMDBG[4],CAMDBG[5]);return;}
  var b=ball.position,ph=G?G.phase:'menu',px=0,py=4.3,pz=9.6,lx=0,ly=1.6,lz=-2,lam=4.2,n=R&&R.next,F=R&&R.F,A=R&&R.att,p=CTRL,q;
  if(REP.on){camera.position.copy(REP.camP);REP.look.lerp(b,Math.min(1,rdt*7));camera.lookAt(REP.look);if(Math.abs(camera.fov-(baseFov-6))>0.01){camera.fov=baseFov-6;camera.updateProjectionMatrix();}return;}
  if(ph==='menu'){px=Math.sin(tAll*0.14)*7.5;py=3.4;pz=10.5+Math.cos(tAll*0.14)*2;lx=0;ly=1.4;lz=0;lam=2;}
  else if(ph==='pre'||ph==='windup'){q=R.srv.pl;if(G.serving===0){px=q.x*0.85;py=3.5;pz=q.z+5.4;lx=lerp(q.x,R.srv.aim.x,0.4);ly=1.5;lz=-1;}else{px=0;py=4.4;pz=12.4;lx=0;ly=1.7;lz=-2.5;}lam=5;}
  else if(ph==='dead'||ph==='end'){var w=R.last&&G.sc?(G.serving):0;q=(R.last&&R.last.pl&&R.last.pl.team===w)?R.last.pl:TEAM[w].pl[1];
    if(w===0){var a=tAll*0.35;px=q.x+Math.sin(a)*1.2+(q.x>0?-1.6:1.6);py=1.9;pz=q.z-3.6;lx=q.x;ly=1.35;lz=q.z;}else{px=q.x*0.5;py=3.2;pz=4.8;lx=q.x;ly=1.3;lz=q.z;}lam=2.6;}
  else if(A&&A.jumped&&!A.done){px=A.hp.x*0.8;py=5.0;pz=7.4;lx=lerp(A.hp.x,A.aim.x,0.5)*0.9;ly=0.6;lz=-3.2;lam=6;}
  else if(A&&!A.done&&!A.late&&p===A.pl){px=A.hp.x*0.78;py=4.5;pz=8.3;lx=lerp(A.hp.x,A.aim.x,0.45)*0.9;ly=1.1+clamp(b.y-3.5,0,3)*0.2;lz=-2.9;lam=4.5;}
  else if(n&&n.team===0&&p&&n.type==='first'){var mx=lerp(p.x,n.p.x,0.5);px=mx*0.8;py=3.6;pz=Math.max(p.z,n.p.z)+5.7;lx=mx;ly=1.3;lz=Math.min(p.z,n.p.z)-4.6;lam=5.5;}
  else if(n&&n.team===0&&p){px=p.x*0.72;py=3.7;pz=Math.max(p.z,3)+5.3;lx=lerp(p.x,n.p.x,0.6);ly=2.0;lz=-2.4;lam=4.5;}
  else if(n&&n.team===0){px=n.p.x*0.55;py=3.9;pz=8.8;lx=n.p.x*0.6;ly=1.8;lz=-1.6;lam=4;}
  else if(n&&n.team===1&&n.type==='hit'&&p){px=lerp(p.x,n.p.x,0.5)*0.75;py=3.8;pz=8.2;lx=n.p.x*0.8;ly=2.1;lz=-1.2;lam=4.5;}
  else{q=p||TEAM[0].pl[0];px=q.x*0.45+b.x*0.15;py=4.3;pz=9.4;lx=b.x*0.55;ly=1.7;lz=-2.3;lam=3.6;}
  if(ph==='live'){ly+=clamp(b.y-4.5,0,4)*0.16;}
  var k=snap?1:1-Math.exp(-rdt*lam);
  CAMP.x+=(px-CAMP.x)*k;CAMP.y+=(py-CAMP.y)*k;CAMP.z+=(pz-CAMP.z)*k;CAML.x+=(lx-CAML.x)*k;CAML.y+=(ly-CAML.y)*k;CAML.z+=(lz-CAML.z)*k;
  camera.position.copy(CAMP);
  if(shakeA>0.003&&rdt>0){camera.position.x+=(Math.random()*2-1)*shakeA;camera.position.y+=(Math.random()*2-1)*shakeA*0.7;shakeA*=Math.pow(0.004,rdt);}else if(rdt>0)shakeA=0;
  camera.lookAt(CAML);var f=baseFov-fovKick;if(Math.abs(camera.fov-f)>0.01){camera.fov=f;camera.updateProjectionMatrix();}
  if(rdt>0)fovKick*=Math.pow(0.03,rdt);}
window.addEventListener('resize',function(){try{size();}catch(e){}});
function remide(){try{var W=window.innerWidth,H=window.innerHeight,r=H>W;if(r!==ROT||(r?H:W)!==appW||(r?W:H)!==appH)size();}catch(e){}}
window.addEventListener('pageshow',function(){remide();setTimeout(remide,300);setTimeout(remide,1200);});

window.addEventListener('orientationchange',function(){setTimeout(function(){try{size();}catch(e){}},250);});

/* si el celular corta la grafica (pasa en iOS al cambiar de app), se avisa y se recarga con un toque */

/* ======================= CUADRO ======================= */
var last=performance.now(),fAcc=0,fN=0,qStep=0,HOLD=false,NOREND=false,FPS_ON=false,fpsV=0;
try{FPS_ON=new URLSearchParams(location.search).get('fps')==='1';}catch(e){}
function quality(ms){fAcc+=ms;fN++;if(fN<90)return;var avg=fAcc/fN;fAcc=0;fN=0;fpsV=Math.round(1000/avg);if(FPS_ON){var fe=$('fps');fe.style.display='block';fe.textContent=fpsV+' fps · '+L('calidad ','quality ')+(3-qStep)+'/3 · '+renderer.info.render.triangles+' tri';}
  if(avg>27&&qStep<3){qStep++;if(qStep===1)PR=Math.min(PR,1.5);else if(qStep===2)PR=1;else{renderer.shadowMap.enabled=false;sun.castShadow=false;}renderer.setPixelRatio(PR);renderer.setSize(appW,appH,true);}}
function frame(now){var rdt=Math.min(0.05,(now-last)/1000);last=now;
  try{if(ready&&!paused&&!HOLD){if(freezeT>0){freezeT-=rdt;camUpdate(rdt,false);}else{keysToJoy();if(TUT.hold){if(TUT.hold==='cho'&&Math.abs(JX)>0.35)tutRelease();}else tutCheck();
      if(TUT.hold){tAll+=rdt;hudFrame(rdt);}else{TS+=(tsGoal-TS)*Math.min(1,rdt*14);step(rdt*TS,rdt);camUpdate(rdt,false);hudFrame(rdt);}}crowdFrame(rdt);if(rdt<0.05)quality(rdt*1000);}
    if(!NOREND)renderer.render(scene,camera);}catch(e){if(window.console)console.error(e);}
  requestAnimationFrame(frame);}

function cargar(){var jobs=[],done=0,total=0;
  function tick(){done++;$('load').textContent=L('Cargando la cancha… ','Loading the court… ')+Math.round(done*100/total)+'%';}

  return Promise.all(jobs);}

},function(e){if(window.console)console.error(e);$('load').textContent=L('No se pudo cargar el juego. Revisa tu conexión y ábrelo otra vez.','Could not load the game. Check your connection and open it again.');});

/* ganchos de prueba (robot que juega solo, para medir rallies y balance) */
window.BB={version:APP_VERSION,render:function(v){NOREND=!v;},net:NET,nLobby:function(){nLobby();},nCreate:function(c){nCreate(c);},nJoin:function(c){nJoin(c);},cam:function(a){CAMDBG=a||null;},hold:function(v){HOLD=!!v;last=performance.now();},adv:function(sec){var n=Math.max(1,Math.round(sec*60));for(var i=0;i<n;i++){var rdt=1/60;freezeT=0;if(TUT.hold){if(TUT.hold==='cho'&&Math.abs(JX)>0.35)tutRelease();}else tutCheck();if(TUT.hold){hudFrame(rdt);continue;}TS+=(tsGoal-TS)*Math.min(1,rdt*14);step(rdt*TS,rdt);camUpdate(rdt,false);hudFrame(rdt);crowdFrame(rdt);}return ctxNow();},joy:function(x,z){JX=x;JZ=z;},state:function(){return {G:G,R:R,CTRL:CTRL,tG:tG,TS:TS,REP:REP};},bot:BOT,press:function(){actionPress();},
  start:function(diff,assist,tut){if(diff)PREF.diff=diff;PREF.assist=!!assist;ov.style.display='none';newMatch(!!tut);},tut:function(){return TUT;},
  sim:function(matches,diff,sd,skip,aim,assist,react){var out={wins:0,losses:0,rallies:0,contacts:0,pts:[0,0],secs:0,st:{a:0,b:0,c:0,d:0,att:0,kill:0,attErr:0,blocked:0,ace:0,blk:0,srvErr:0,aiAtt:0,aiKill:0,aiErr:0,dive:0,aiDive:0},hist:{}};BOT.react=react||0;
    PREF.diff=diff||'easy';PREF.assist=!!assist;BOT.on=true;BOT.sim=true;BOT.sd=sd==null?0.05:sd;BOT.skip=skip||0;BOT.aim=aim||'open';BOT.log=[];var snd=PREF.snd;PREF.snd=false;
    for(var m=0;m<matches;m++){newMatch(false);var t0=tG,guard=0;while(G.phase!=='end'&&guard<400000){freezeT=0;step(1/60,1/60);guard++;}
      if(G.sc[0]>G.sc[1])out.wins++;else out.losses++;out.pts[0]+=G.sc[0];out.pts[1]+=G.sc[1];out.secs+=tG-t0;out.rallies+=G.st.rallies;out.contacts+=G.st.contacts;for(var k in out.st)out.st[k]+=G.st[k];}
    BOT.log.forEach(function(c){var b=c>=8?'8+':(''+c);out.hist[b]=(out.hist[b]||0)+1;});
    BOT.on=false;BOT.sim=false;PREF.snd=snd;out.avgContacts=out.contacts/Math.max(1,out.rallies);out.avgSecs=out.secs/matches;menu();return out;}};
})();
