<style>

<script>
(function(){
'use strict';
var APP_VERSION='0.5.1';
var W=300,H=460,G=800,PLAT=66,FLOOR=20;
var AZUL='#1B2A6B',AMA='#EB448F',TINTA='#0E1116',HUESO='#F2EFE8',VOL='#C6F432',OLI='#4F6B00',ROJO='#d93a2b';
var cv=document.getElementById('c'),cx=cv.getContext('2d'),app=document.getElementById('app'),ov=document.getElementById('ov');
var K=1,IMG={},BASE='/juegos/keepup/assets/';
/* ---------- Angels: récords del equipo ---------- */
var TOKEN=(function(){try{var ok=function(s){return !!s&&/^[A-Za-z0-9]{32,128}$/.test(s);};var q=null;try{q=new URLSearchParams(location.search).get('t');}catch(e){}var h=(location.hash||'').replace(/^#/,'');return ok(q)?q:(ok(h)?h:null);}catch(e){return null;}})();
var STAFF=(function(){try{return !TOKEN&&new URLSearchParams(location.search).get('staff')==='1';}catch(e){return false;}})();
var SBC=null;try{if(TOKEN&&window.supabase)SBC=window.supabase.createClient('https://qagvxlenrojmgzjoywzm.supabase.co','sb_publishable_X9_9OKteMkCNcIHj5skkmg_KgptD6V2',{db:{schema:'angels'},auth:{persistSession:false,autoRefreshToken:false}});
  else if(STAFF&&window.supabase)SBC=window.supabase.createClient('https://qagvxlenrojmgzjoywzm.supabase.co','sb_publishable_X9_9OKteMkCNcIHj5skkmg_KgptD6V2',{db:{schema:'angels'}});}catch(e){SBC=null;}
function vqEnvia(game,score,meta,cb){try{if(!SBC){if(cb)cb(null);return;}var sc=Math.max(0,Math.round(score));(STAFF?SBC.rpc('staff_game_submit',{p_game:game,p_score:sc,p_meta:meta}):SBC.rpc('player_game_submit',{p_token:TOKEN,p_game:game,p_score:sc,p_meta:meta})).then(function(r){if(cb)cb(r&&!r.error?r.data:null);},function(){if(cb)cb(null);});}catch(e){if(cb)cb(null);}}
function vqTop(game,cb){try{if(!SBC){cb(null);return;}(STAFF?SBC.rpc('staff_game_board',{p_game:game}):SBC.rpc('player_game_board',{p_token:TOKEN,p_game:game,p_scope:'team'})).then(function(r){cb(r&&!r.error?r.data:null);},function(){cb(null);});}catch(e){cb(null);}}
function vqEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function vqTopHTML(d,unit){try{if(!d||!d.top||!d.top.length)return '<p class="sub" style="margin-top:10px">Be the first on the Angels board.</p>';
  var h='<div style="margin-top:12px;text-align:left;font-size:13px"><div class="sub" style="margin-bottom:4px">Angels · all-time top</div>';
  d.top.slice(0,5).forEach(function(r){h+='<div style="display:flex;gap:8px;padding:4px 8px;border-radius:8px;'+(r.me?'background:rgba(235,68,143,0.18);font-weight:700':'')+'"><span style="width:18px;opacity:.7">'+r.pos+'</span><span style="flex:1">'+(r.coach?'Coach':'#'+vqEsc(r.number||'')+' '+vqEsc(r.name))+'</span><span>'+Number(r.score).toLocaleString('en-US')+(unit||'')+'</span></div>';});
  if(d.me&&d.me.pos>5)h+='<div style="display:flex;gap:8px;padding:4px 8px;border-radius:8px;background:rgba(235,68,143,0.18);font-weight:700"><span style="width:18px;opacity:.7">'+d.me.pos+'</span><span style="flex:1">You</span><span>'+Number(d.me.score).toLocaleString('en-US')+(unit||'')+'</span></div>';
  return h+'</div>';}catch(e){return '';}}
function vqPinta(id,game,unit){try{vqTop(game,function(d){var el=document.getElementById(id);if(el&&d)el.innerHTML=vqTopHTML(d,unit);});}catch(e){}}
try{var vb=document.getElementById('volver');if(vb){if(TOKEN){vb.href='/?t='+TOKEN+'&go=juegos';vb.style.display='inline-block';}else if(STAFF){vb.href='/?go=juegos';vb.style.display='inline-block';}}}catch(e){}

var FONDOS=[{src:'mv_gym',f:0.865,h:530},{src:'mv_park',f:0.78,h:570},{src:'mv_beach',f:0.87,h:530}];
var S={estado:'inicio'},rec={pts:0,niv:0,toq:0},sonido=false,ac=null;
try{var rr0=JSON.parse(localStorage.getItem('angels_keepup_rec_v5')||'null');if(rr0)rec=rr0;}catch(e){}
function rnd(a,b){return a+Math.random()*(b-a);}
function sgn(){return Math.random()<0.5?-1:1;}
function fmt(n){try{return Math.round(n).toLocaleString('en-US');}catch(e){return ''+Math.round(n);}}
function snd(f,d,t,v){if(!sonido)return;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,ac.currentTime);g.gain.setValueAtTime(v||0.1,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function carga(cb){var l=['mv_gym','mv_park','mv_beach','mv_bloque','mv_rayo','mv_barra','mv_pu_grande','mv_pu_piso','mv_pu_iman','balon','moneda','botella'],n=l.length;
  l.forEach(function(nm){var im=new Image();im.onload=im.onerror=function(){n--;if(n===0)cb();};im.src=BASE+nm+'.webp';IMG[nm]=im;});}
function fondoDe(L){return L<=2?0:L<=4?1:2;}
function bola(x,y){return {x:x,y:y,vx:0,vy:0,chain:0,wall:false,rot:0,slow:0,tr:[]};}
function cae(){var o=bola(rnd(70,230),H-30);o.vx=rnd(30,80)*sgn();o.vy=-20;return o;}
function rad(){return S.tGrande>0?13:9;}

/* Barras (0.5.0). Bajas: entre el jugador y los objetivos, de una sola
   direccion (la bola las atraviesa al subir y rebota si cae encima). Altas:
   encima de los objetivos, solidas e inclinadas hacia dentro: devuelven la
   bola sobre los objetivos (tiro de banda). Nivel 1 sin barras; del 3 en
   adelante mas barras moviles y mas rapidas, sin bloquear la subida. */
function barras(L){var b=[];
  function alta(x,y,len,ang,amp,spd){b.push({tipo:'alta',bx:x,cx:x,cy:y,len:len,ang:ang,amp:amp||0,spd:spd||0,ph:rnd(0,6),fl:0,hitT:0});}
  function baja(x,y,len,amp,spd){b.push({tipo:'baja',one:true,bx:x,cx:x,cy:y,len:len,ang:sgn()*rnd(0.04,0.12),amp:amp||0,spd:spd||0,ph:rnd(0,6),fl:0,hitT:0});}
  if(L===1)return b;
  alta(62,424,70,rnd(0.32,0.46));alta(238,424,70,-rnd(0.32,0.46));
  if(L===2)return b;
  if(L===3){baja(150,235,62,70,0.8);return b;}
  if(L===4){baja(150,235,58,80,1.0);alta(150,428,56,0,55,0.7);return b;}
  var nb=Math.min(3,L-3),na=Math.min(2,L-4),sp=Math.min(2.2,0.8+L*0.1),i;
  for(i=0;i<nb;i++)baja(150,215+i*24,rnd(50,62),rnd(70,105),sp+i*0.15);
  for(i=0;i<na;i++)alta(150,428-i*4,rnd(46,56),i?-0.12:0.12,rnd(50,75),sp*0.8+i*0.2);
  return b;}
function objetivos(L){var t=[],cells=[],c,r;
  for(r=0;r<4;r++)for(c=0;c<6;c++)cells.push([28+c*48.8,286+r*36]);
  cells.sort(function(){return Math.random()-0.5;});
  var na=Math.max(3,8-L),nz=2+L,nb=L<2?0:Math.min(5,L-1),i=0,vidaPuesta=false;
  function pon(tp){var p=cells[i++];if(!p)return;var o={x:p[0]+rnd(-6,6),y:p[1]+rnd(-5,5),tp:tp,req:true,ph:rnd(0,6)};
    if(tp==='am'){o.r=8;o.val=10;}else if(tp==='az'){o.r=10;o.val=25;}
    else{o.w=34;o.h=16;o.hp=3;o.val=75;if(L>=3&&!vidaPuesta&&Math.random()<0.6){o.vida=true;vidaPuesta=true;}}
    t.push(o);}
  for(var a=0;a<na;a++)pon('am');for(var z=0;z<nz;z++)pon('az');for(var q=0;q<nb;q++)pon('bl');
  return t;}

function nuevo(){S={estado:'juego',L:1,pts:0,toq:0,vidas:3,px:S.target||150,target:S.target||150,t:0,lift:0,cel:0,lam:0,shake:0,hit:0,flash:0,
  balls:[],bars:[],tg:[],drops:[],parts:[],txt:[],tGrande:0,tIman:0,piso:false,pend:0,vt:rnd(5,9),banner:0,fondo:0,fondoPrev:-1,mix:1,pasoRec:false,w0:performance.now()};
  nivel(1);}
function nivel(L){S.L=L;S.bars=barras(L);S.tg=objetivos(L);S.balls=[cae()];S.drops=[];S.banner=1.7;S.estado='banner';S.vt=rnd(5,9);
  var f=fondoDe(L);if(f!==S.fondo){S.fondoPrev=S.fondo;S.fondo=f;S.mix=0;}snd(660,0.25,'triangle');}

function txt(x,y,s,col,big){S.txt.push({x:x,y:y,s:s,c:col||TINTA,life:1,big:big});}
function burst(x,y,cols,n,sz){for(var i=0;i<n;i++){var a=rnd(0,6.28),v=rnd(40,180);S.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.4,0.85),c:cols[i%cols.length],s:sz?rnd(sz*0.6,sz):rnd(2,4),rot:rnd(0,6),vr:rnd(-10,10),sq:!!sz});}}
function premio(o,val,x,y){o.chain++;var mult=o.chain>=3?3:(o.chain>=2?2:1),banda=o.wall?1.5:1,p=Math.round(val*mult*banda);S.pts+=p;
  var s='+'+p;if(mult>1)s+=' x'+mult;if(banda>1)s+=' bank shot';txt(x,y,s,mult>1?AZUL:TINTA,mult>1||banda>1);
  if(mult>=2){S.shake=Math.max(S.shake,mult*1.6);S.flash=Math.max(S.flash,0.25*mult);}
  if(!S.pasoRec&&rec.pts>0&&S.pts>rec.pts){S.pasoRec=true;txt(150,H-90,'New record',OLI,true);snd(990,0.35,'triangle');burst(150,H-100,[VOL,AMA,'#ffffff'],24);}}
function suelta(x,y,k){S.drops.push({x:x,y:y,k:k,vy:-85});}

function segHit(o,b,r){var dx=Math.cos(b.ang)*b.len/2,dy=Math.sin(b.ang)*b.len/2,ax=b.cx-dx,ay=b.cy-dy,ex=dx*2,ey=dy*2;
  var t=((o.x-ax)*ex+(o.y-ay)*ey)/(ex*ex+ey*ey);t=Math.max(0,Math.min(1,t));var qx=ax+ex*t,qy=ay+ey*t,ddx=o.x-qx,ddy=o.y-qy,d=Math.sqrt(ddx*ddx+ddy*ddy),lim=r+4.5;
  if(!(d<lim&&d>0.0001))return;
  var nx=ddx/d,ny=ddy/d;
  if(b.one&&(o.vy>0||ny<0)){if(o.vy>0&&ny<0&&!(b.fl>0)){b.fl=0.3;burst(qx,qy,[VOL,'#ffffff'],5,3);}return;}
  var dot=o.vx*nx+o.vy*ny;
  if(dot<0){o.vx-=1.55*dot*nx;o.vy-=1.55*dot*ny;o.capT=0.8;b.hitT=0.2;if(b.tipo==='alta')o.wall=true;if(Math.abs(dot)>120)snd(260,0.05,'square',0.05);}
  o.x=qx+nx*lim;o.y=qy+ny*lim;}
// Donde cae la bola en la linea del jugador. Solo si va bajando y no tiene
// barras ni cajas debajo; si no, null.
function caida(o,R){try{if(o.vy>=0)return null;
  var x=o.x,y=o.y,vx=o.vx,vy=o.vy,cap=o.capT||0,dt=1/60,yp=PLAT+12+R,i,k;
  for(i=0;i<180;i++){vy-=G*dt;if(cap>0){cap-=dt;if(vy<-430)vy=-430;}x+=vx*dt;y+=vy*dt;
    if(x<R){x=R;vx=Math.abs(vx);}if(x>W-R){x=W-R;vx=-Math.abs(vx);}
    if(y<=yp)return x;
    for(k=0;k<S.bars.length;k++){var b=S.bars[k],hw=b.len/2+(b.amp||0)+R+4,hh=Math.abs(Math.sin(b.ang))*b.len/2+R+4;if(Math.abs(x-b.bx)<hw&&Math.abs(y-b.cy)<hh)return null;}
    for(k=0;k<S.tg.length;k++){var g=S.tg[k];if(g.w&&Math.abs(x-g.x)<g.w/2+R&&Math.abs(y-g.y)<g.h/2+R)return null;}}
  return null;}catch(e){return null;}}

function step(rdt){
  if(S.hit>0){S.hit-=rdt;return;}
  var dt=rdt;S.t+=dt;var i,k;
  S.mix=Math.min(1,(S.mix||1)+dt*1.2);
  for(i=0;i<S.parts.length;i++){var p=S.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy-=300*dt;p.life-=dt;p.rot+=p.vr*dt;}
  S.parts=S.parts.filter(function(p){return p.life>0;});
  for(i=0;i<S.txt.length;i++){S.txt[i].y+=40*dt;S.txt[i].life-=dt*0.85;}
  S.txt=S.txt.filter(function(p){return p.life>0;});
  S.shake=Math.max(0,S.shake-dt*12);S.flash=Math.max(0,S.flash-dt*2.5);S.lift=Math.max(0,S.lift-dt*40);S.cel=Math.max(0,S.cel-dt);S.lam=Math.max(0,S.lam-dt);
  for(i=0;i<S.bars.length;i++){var b=S.bars[i];if(b.amp)b.cx=b.bx+Math.sin(S.t*b.spd+b.ph)*b.amp;if(b.fl>0)b.fl-=dt;if(b.hitT>0)b.hitT-=dt;}
  for(i=0;i<S.tg.length;i++)if(S.tg[i].hitT)S.tg[i].hitT=Math.max(0,S.tg[i].hitT-dt);
  if(S.estado==='banner'){S.banner-=dt;S.px+=(S.target-S.px)*Math.min(1,dt*14);if(S.banner<=0)S.estado='juego';return;}
  if(S.estado!=='juego')return;
  S.px+=(S.target-S.px)*Math.min(1,dt*14);S.px=Math.max(26,Math.min(W-26,S.px));
  S.tGrande=Math.max(0,S.tGrande-dt);S.tIman=Math.max(0,S.tIman-dt);
  if(S.pend>0){S.pend-=dt;if(S.pend<=0)S.balls.push(cae());}
  if(S.L>=2){S.vt-=dt;if(S.vt<=0){S.vt=rnd(7,12);var vida=Math.random()<0.15,dir=sgn();
    S.tg.push({x:dir>0?-10:W+10,y:rnd(260,400),tp:vida?'vi':'vo',r:vida?10:8,val:100,vx:dir*rnd(35,55),ttl:9,req:false,ph:rnd(0,6),tr:[]});}}
  for(i=0;i<S.tg.length;i++){var g=S.tg[i];if(g.vx){g.x+=g.vx*dt;g.ttl-=dt;g.y+=Math.sin(S.t*3+i)*0.4;if(g.tr){g.tr.push({x:g.x,y:g.y});if(g.tr.length>10)g.tr.shift();}}}
  S.tg=S.tg.filter(function(g){return !g.vx||(g.ttl>0&&g.x>-20&&g.x<W+20);});
  var R=rad();
  for(i=S.balls.length-1;i>=0;i--){var o=S.balls[i];
    o.vy-=G*dt;if(o.capT>0){o.capT-=dt;if(o.vy<-430)o.vy=-430;}o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vx/R*dt*0.6;
    o.tr.push({x:o.x,y:o.y});if(o.tr.length>8)o.tr.shift();
    if(o.x<R){o.x=R;o.vx=Math.abs(o.vx);o.wall=true;} if(o.x>W-R){o.x=W-R;o.vx=-Math.abs(o.vx);o.wall=true;}
    if(o.y>H-R){o.y=H-R;o.vy=-Math.abs(o.vy)*0.8;}
    if(o.pasa>0)o.pasa-=dt;else for(k=0;k<S.bars.length;k++)segHit(o,S.bars[k],R);
    if(Math.abs(o.vx)+Math.abs(o.vy)<110&&o.y>PLAT+40){o.slow+=dt;if(o.slow>0.5){if(o.capT>0){o.pasa=0.5;o.vy=-80;o.vx=rnd(-40,40);}else{o.vx=rnd(130,190)*sgn();o.vy=260;}o.slow=0;}}else o.slow=0;
    for(k=S.tg.length-1;k>=0;k--){var t=S.tg[k];
      if(S.tIman>0&&t.r&&t.tp!=='vi'){var mx=o.x-t.x,my=o.y-t.y,md=Math.sqrt(mx*mx+my*my);if(md<90&&md>1){t.x+=mx/md*120*dt;t.y+=my/md*120*dt;}}
      if(t.r){var ddx=o.x-t.x,ddy=o.y-t.y;if(ddx*ddx+ddy*ddy<(R+t.r)*(R+t.r)){S.tg.splice(k,1);
        if(t.tp==='vi'){if(S.vidas<3){S.vidas++;txt(t.x,t.y,'+1 life',AZUL,true);}else premio(o,100,t.x,t.y);burst(t.x,t.y,['#9fc4f0','#ffffff',AZUL],18);snd(880,0.3,'triangle');}
        else{premio(o,t.val,t.x,t.y);burst(t.x,t.y,t.tp==='vo'?[VOL,OLI,'#ffffff']:t.tp==='am'?[AMA,'#FBD3E5']:[AZUL,AMA,'#ffffff'],t.tp==='vo'?22:12);snd(t.tp==='am'?740:t.tp==='az'?880:1100,0.12,'square',0.07);}}}
      else{var qx=Math.max(t.x-t.w/2,Math.min(o.x,t.x+t.w/2)),qy=Math.max(t.y-t.h/2,Math.min(o.y,t.y+t.h/2)),ex=o.x-qx,ey=o.y-qy;
        if(ex*ex+ey*ey<R*R){var px2=(t.w/2+R)-Math.abs(o.x-t.x),py2=(t.h/2+R)-Math.abs(o.y-t.y);
          if(px2<py2){o.vx=(o.x<t.x?-1:1)*Math.max(80,Math.abs(o.vx));o.x+=(o.x<t.x?-px2:px2);}else{o.vy=(o.y<t.y?-1:1)*Math.abs(o.vy)*0.9;o.y+=(o.y<t.y?-py2:py2);o.vx+=rnd(-40,40);}
          t.hp--;t.hitT=0.18;burst(qx,qy,[AZUL,AMA],6,4);snd(220,0.08,'square',0.08);
