/* =====================================================================

function $(id){return document.getElementById(id);}

var BRAND='vaqueros';try{var bh=(location.hostname||'').toLowerCase();if(bh.indexOf('angels')>=0||qp('brand')==='angels')BRAND='angels';if(qp('brand')==='vaqueros')BRAND='vaqueros';}catch(e){}
var CFG=BRAND==='angels'?{team:'Angels',app:'Angels',schema:'angels',ls:'angels_keepup_rec_v5',ls2:'angels_keepup2_rec_v1',AZUL:'#1B2A6B',AMA:'#EB448F',pad:'#26398a',padHi:'#3a52b8',kit:{jersey:'#51B7E4',shorts:'#1B2A6B',trim:'#EB448F'},ball:['#51B7E4','#1B2A6B','#F2EFE8'],accRGB:'235,68,143'}
  :{team:'Vaqueros',app:'STATION',schema:'station',ls:'vq_keepup_rec_v5',ls2:'vq_keepup2_rec_v1',AZUL:'#023B9F',AMA:'#FFCF27',pad:'#1546b8',padHi:'#2a63d8',kit:{jersey:'#00389C',shorts:'#F1F3F6',trim:'#FCCC24'},ball:['#FCCC24','#00389C','#F2EFE8'],accRGB:'255,207,39'};
try{document.documentElement.style.setProperty('--acc',CFG.AMA);document.documentElement.style.setProperty('--azul',CFG.AZUL);document.title='Keep It Up · '+CFG.team;}catch(e){}

/* el 2D de siempre: si se pide, o si el telefono no tiene WebGL */

if(qp('clasico')==='1'||!window.VOLEII||!window.VOLEII.T3J||!webglOK()){aClasico();return;}
var T3=window.VOLEII.T3J,THREE=T3.THREE,V3=THREE.Vector3,Q4=THREE.Quaternion;

/* ---------- STATION / Angels: records del equipo (igual que 0.5.1) ---------- */
var TOKEN=(function(){try{var ok=function(s){return !!s&&/^[A-Za-z0-9]{32,128}$/.test(s);};var q=null;try{q=new URLSearchParams(location.search).get('t');}catch(e){}var h=(location.hash||'').replace(/^#/,'');return ok(q)?q:(ok(h)?h:null);}catch(e){return null;}})();
var STAFF=(function(){try{return !TOKEN&&new URLSearchParams(location.search).get('staff')==='1';}catch(e){return false;}})();
var BOTQ=qp('bot')==='1';
var SBC=null;try{if(TOKEN&&window.supabase&&!BOTQ)SBC=window.supabase.createClient('https://qagvxlenrojmgzjoywzm.supabase.co','sb_publishable_X9_9OKteMkCNcIHj5skkmg_KgptD6V2',{db:{schema:CFG.schema},auth:{persistSession:false,autoRefreshToken:false}});
  else if(STAFF&&window.supabase&&!BOTQ)SBC=window.supabase.createClient('https://qagvxlenrojmgzjoywzm.supabase.co','sb_publishable_X9_9OKteMkCNcIHj5skkmg_KgptD6V2',{db:{schema:CFG.schema}});}catch(e){SBC=null;}
/* Presencia (16 nov. 2026): con el enlace del jugador, avisa cada minuto que sigue en este juego, para el cuadro
   "Ahora en la app" del staff. Sin enlace (staff, play.bareboru.com, robot) no hace nada. */
(function(){try{if(!TOKEN||!SBC)return;var late=function(){try{if(document.hidden)return;SBC.rpc('player_ping',{p_token:TOKEN,p_donde:'juego',p_ref:'keepup2'}).then(function(){},function(){});}catch(e){}};
  late();setInterval(late,60000);document.addEventListener('visibilitychange',function(){try{if(!document.hidden)late();}catch(e){}});}catch(e){}})();
function vqEnvia(game,score,meta,cb){try{if(!SBC){if(cb)cb(null);return;}var sc=Math.max(0,Math.round(score));(STAFF?SBC.rpc('staff_game_submit',{p_game:game,p_score:sc,p_meta:meta}):SBC.rpc('player_game_submit',{p_token:TOKEN,p_game:game,p_score:sc,p_meta:meta})).then(function(r){if(cb)cb(r&&!r.error?r.data:null);},function(){if(cb)cb(null);});}catch(e){if(cb)cb(null);}}
function vqTop(game,cb){try{if(!SBC){cb(null);return;}(STAFF?SBC.rpc('staff_game_board',{p_game:game}):SBC.rpc('player_game_board',{p_token:TOKEN,p_game:game,p_scope:'team'})).then(function(r){cb(r&&!r.error?r.data:null);},function(){cb(null);});}catch(e){cb(null);}}
function vqEsc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function vqTopHTML(d,unit){try{var tn=CFG.team+(BRAND==='vaqueros'&&d&&d.team?' '+d.team:'');
  if(!d||!d.top||!d.top.length)return '<div class="panel"><h3>'+vqEsc(tn)+' · all-time top</h3><div class="sub">Be the first on the board.</div></div>';
  var h='<div class="panel"><h3>'+vqEsc(tn)+' · all-time top</h3><div class="top">';
  d.top.slice(0,5).forEach(function(r){h+='<div class="f'+(r.me?' me':'')+'"><span>'+r.pos+'</span><span>'+(r.coach?'Coach':'#'+vqEsc(r.number||'')+' '+vqEsc(r.name))+'</span><span>'+Number(r.score).toLocaleString('en-US')+(unit||'')+'</span></div>';});
  if(d.me&&d.me.pos>5)h+='<div class="f me"><span>'+d.me.pos+'</span><span>You</span><span>'+Number(d.me.score).toLocaleString('en-US')+(unit||'')+'</span></div>';
  return h+'</div></div>';}catch(e){return '';}}
function vqPinta(id,game,unit){try{vqTop(game,function(d){var el=document.getElementById(id);if(el&&d)el.innerHTML=vqTopHTML(d,unit);});}catch(e){}}
var BACK_HREF=null;try{if(TOKEN)BACK_HREF='/?t='+TOKEN+'&go=juegos';else if(STAFF)BACK_HREF='/?go=juegos';}catch(e){}

/* ---------- preferencias (compartidas con Long Spike) ---------- */
var PREF={snd:true,mus:true,vib:true};
try{var pr0=JSON.parse(localStorage.getItem('voleii_juegos_pref_v1')||'null');if(pr0){if(pr0.snd===false)PREF.snd=false;if(pr0.mus===false)PREF.mus=false;if(pr0.vib===false)PREF.vib=false;}}catch(e){}
function prefSave(){try{localStorage.setItem('voleii_juegos_pref_v1',JSON.stringify(PREF));}catch(e){}}

/* =====================================================================
   LOGICA (Keep It Up 2.0). Fisica nueva, hecha para 3D. Unidades: 1 = 1 cm.
   - El jugador acelera y frena como una persona (no se teletransporta al dedo).
   - El balon se pasa donde estan los antebrazos: de pie (alcance corto),
     abajo con una rodilla (alcance medio) o en plancha (alcance largo, y
     despues tarda en levantarse).
   - El pase sale mejor si el jugador llega y se para (plataforma quieta).
   - Sin techo: lo unico que devuelve el balon es lo que se ve (las torres
     de los lados, las barras y las cajas).
   - Paso fijo de 1/120 s: se juega igual a 30, 60 o 120 cuadros.
   La marca no es comparable con la de 0.5.1 (top nuevo: keepup2).
   ===================================================================== */
var W=400,CX=200,H=700,FLOOR=0,G=920,PASO=1/120;
var AZUL=CFG.AZUL,AMA=CFG.AMA,TINTA='#0E1116',HUESO='#F2EFE8',VOL='#C6F432',OLI='#4F6B00',ROJO='#d93a2b';
var VMAX=430,ACC=2400,DEC=3200,REACH=52,REACH_DIG=74,REACH_DIVE=185,Y_PASE=60,Y_DIG=24,Y_DIVE=10,T_DIVE=0.30,T_DOWN=0.72,BRAZO=58;
var S={estado:'inicio'},rec={pts:0,niv:0,toq:0},DEMO=false;
try{var rr0=JSON.parse(localStorage.getItem(CFG.ls2)||'null');if(rr0)rec=rr0;}catch(e){}
function rnd(a,b){return a+Math.random()*(b-a);}
function sgn(){return Math.random()<0.5?-1:1;}
function fmt(n){try{return Math.round(n).toLocaleString('en-US');}catch(e){return ''+Math.round(n);}}
function fondoDe(L){return L<=2?0:L<=4?1:2;}
function bola(x,y){return {x:x,y:y,vx:0,vy:0,chain:0,wall:false,rot:0,capT:0,dive:false,tr:[]};}
function cae(){var o=bola(rnd(CX-90,CX+90),H+20);o.vx=rnd(30,80)*sgn();o.vy=-20;return o;}
function rad(){return S.tGrande>0?17:12;}
function barras(L){var b=[];
  function alta(x,y,len,ang,amp,spd){b.push({tipo:'alta',bx:x,cx:x,cy:y,len:len,ang:ang,amp:amp||0,spd:spd||0,ph:rnd(0,6),fl:0,hitT:0,off:0,reb:0,rebT:0});}
  function baja(x,y,len,amp,spd){b.push({tipo:'baja',one:true,bx:x,cx:x,cy:y,len:len,ang:sgn()*rnd(0.16,0.24),amp:amp||0,spd:spd||0,ph:rnd(0,6),fl:0,hitT:0,off:0,reb:0,rebT:0});}
  if(L===1)return b;
  alta(CX-118,512,92,rnd(0.32,0.46));alta(CX+118,512,92,-rnd(0.32,0.46));
  if(L===2)return b;
  if(L===3){baja(CX,212,80,95,0.8);return b;}
  if(L===4){baja(CX,212,76,105,1.0);alta(CX,520,72,0.1,70,0.7);return b;}
  var nb=Math.min(3,L-3),na=Math.min(2,L-4),sp=Math.min(2.2,0.8+L*0.1),i;
  for(i=0;i<nb;i++)baja(CX,200+i*27,rnd(66,82),rnd(95,135),sp+i*0.15);
  for(i=0;i<na;i++)alta(CX,520-i*6,rnd(60,74),i?-0.12:0.12,rnd(65,100),sp*0.8+i*0.2);
  return b;}
function objetivos(L){var t=[],cells=[],c,r;
  for(r=0;r<4;r++)for(c=0;c<6;c++)cells.push([CX-160+c*64,280+r*62]);
  cells.sort(function(){return Math.random()-0.5;});
  var na=Math.max(3,8-L),nz=2+L,nb=L<2?0:Math.min(5,L-1),i=0,vidaPuesta=false;
  function pon(tp){var p=cells[i++];if(!p)return;var o={x:p[0]+rnd(-8,8),y:p[1]+rnd(-7,7),tp:tp,req:true,ph:rnd(0,6)};
    if(tp==='am'){o.r=11;o.val=10;}else if(tp==='az'){o.r=14;o.val=25;}
    else{o.w=46;o.h=22;o.hp=3;o.val=75;if(L>=3&&!vidaPuesta&&Math.random()<0.6){o.vida=true;vidaPuesta=true;}}
    t.push(o);}

  camDbg:function(o){CAMDBG=o||null;if(!o){camera.fov=38;camera.updateProjectionMatrix();}},hold:function(v){HOLD=!!v;last=performance.now();},
  adv:function(sec,dt){dt=dt||1/60;var n=Math.max(1,Math.round(sec/dt));for(var i=0;i<n;i++)tick(dt);render(dt);var I=renderer.info.render;return {calls:I.calls,tris:I.triangles,pts:S.pts,L:S.L,toq:S.toq,estado:S.estado,vidas:S.vidas,pst:S.pst};},
  state:function(){return S;},st:function(){return ST;},bot:BOT,ql:function(v){if(v){QMAX=v;QL=v;qAplica();}return QL;},start:function(){arranca();},
  sim:function(sec){var n=Math.round(sec*120);for(var i=0;i<n;i++){if(BOT.on)botPaso();step(PASO);if(S.estado==='fin')break;}return {pts:S.pts,L:S.L,toq:S.toq,vidas:S.vidas,estado:S.estado,t:S.t,dives:ST.dives,digs:ST.digs,perf:ST.perf};},
  cam:function(){return {d:CAMD,y:CAMY,hv:HV,asp:ASP};}};
})();
