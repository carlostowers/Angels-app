function planBlock(o,commit){var lo=LU(1),mb=lo.MB,T=TEMPO[o.tempo].t,list=[],c=-sgn(o.x||1),rt=Math.max(0,T-D.ai.react)*D.ai.blkV*0.8;

function makePass(team,pl,gr){var s=team===0?1:-1,gi='abcd'.indexOf(gr),em=gr==='d',o=LU(team),i;

  var sd=pl===o.S,setter=sd?o.ohB:o.S,tgt=sd?LW(team,0,2.4):LW(team,0.5,0.9),wz=(sd&&!em)?0.55:0.1;

    if(o.k==='seg'){var side=LU(1).MB.x>0?-1:1;
      var Fs=overNet('tip',ball.position,{x:side*rnd(2.2,3.0),z:-rnd(2.0,2.8)},0.85,0.2);Fs.pace=0.15;R.F=Fs;R.last={team:0,pl:setter,type:'tip'};R.atk={grade:R.pass.grade,kind:'seg'};

function aiPlanSet(gr,setter){var opts=R.opts,mbx=LU(0).MB.x,i,best=null,bs=-1e9;

  if(G.phase==='windup'){if(G.serving===0&&R.srv.press==null){e=tG-(R.srv.tC-REC_LEAD);if(e>-0.6)R.srv.press=e;}return;}
  if(G.phase!=='live')return;var n=R.next,F=R.F,c=R.choose;
  if(c&&!c.made){if(c.seg){if(c.seg.k==='at2'){if(F&&F.t<c.seg.tD){c.useSeg=true;sUi();confirmChoice();}}else{c.useSeg=!c.useSeg;sUi();}}return;}
  if(!n||!F)return;
  if(n.team===0&&n.type==='first'){if(R.recv.press==null){e=F.t-(n.t-REC_LEAD);if(e>-0.7)R.recv.press=e;}return;}
  if(n.team===0&&n.type==='hit'&&R.att){if(R.att.jumped)userHit();else if(!R.att.late){e=F.t-R.att.tTake;if(e>(R.att.two?-0.3:-0.7))userJump(e);}return;}
  if(n.team===0&&(n.type==='set'||n.type==='emg')&&R.att&&!R.att.jumped&&R.att.preT==null){e=tG-(F.t0+n.t+TEMPO[R.att.tempo].t-TAKE);if(e>-0.7){R.att.preT=tG;sUi();}return;}
  if(n.team===1&&n.type==='hit'&&R.blkU&&!R.blkU.jumped){userBlockJump();return;}}

function quality(ms){fAcc+=ms;fN++;if(fN<90)return;var avg=fAcc/fN;fAcc=0;fN=0;fpsV=Math.round(1000/avg);if(FPS_ON){var fe=$('fps');fe.style.display='block';fe.textContent=fpsV+' fps · '+L('calidad ','quality ')+(QMAX-qStep)+'/'+QMAX+' · '+renderer.info.render.triangles+' tri';}
  if(avg>27&&qStep<QMAX){qStep++;if(qStep===2)PR=Math.min(PR,1.5);else if(qStep===3)PR=1;applyQ();renderer.setPixelRatio(PR);renderer.setSize(appW,appH,true);}}
function frame(now){var rdt=Math.min(0.05,(now-last)/1000);last=now;
  try{if(ready&&!paused&&!HOLD){if(freezeT>0){freezeT-=rdt;camUpdate(rdt,false);}else{keysToJoy();if(TUT.hold){if(TUT.hold==='cho'&&(Math.abs(JX)>0.35||Math.abs(JZ)>0.35))tutRelease();}else tutCheck();
      if(TUT.hold){tAll+=rdt;hudFrame(rdt);}else{TS+=(tsGoal-TS)*Math.min(1,rdt*14);step(rdt*TS,rdt);camUpdate(rdt,false);hudFrame(rdt);}}crowdFrame(rdt);if(rdt<0.05)quality(rdt*1000);}
    if(!NOREND)renderer.render(scene,camera);}catch(e){if(window.console)console.error(e);}
  requestAnimationFrame(frame);}

/* ======================= CARGA ======================= */
var B3='/juegos/bareboru/3d/',B6='/juegos/bareboru6/3d/';
var CLIP_LIST={espera:{},espera_defensa:{},desplaza_lateral:{},desplaza_frente_atras:{},recibo_frente:{contact:0.4589},recibo_izq:{contact:0.5706},recibo_der:{contact:0.4654},
  plancha_frente:{contact:0.3964},defensa_rodilla:{contact:0.4776},voleo_frente:{contact:0.7179},devolucion:{contact:0.4507},
  ataque:{takeoff:0.5874,landing:0.7273,contact:0.6573},bloqueo_frente:{takeoff:0.5812,landing:0.7749,contact:0.6702},
  saque_flotante:{contact:0.4983},saque_salto:{takeoff:0.6176,landing:0.739,contact:0.6875},celebra_1:{},celebra_2:{},lamenta_1:{},
  bloqueo_izq:{takeoff:0.7169,landing:0.8382,contact:0.75},bloqueo_der:{takeoff:0.5363,landing:0.7039,contact:0.6201},voleo_izq:{contact:0.5812},voleo_der:{contact:0.3},
  plancha_izq:{contact:0.3348},plancha_der:{contact:0.3012},celebra_3:{},lamenta_2:{},ataque_corto:{takeoff:0.4555,landing:0.6545,contact:0.5602,b6:1}};
function cargar(){var jobs=[],done=0,total=0,SRC={};
  function tick(){done++;$('load').textContent=L('Cargando la cancha… ','Loading the court… ')+Math.round(done*100/total)+'%';}
  Object.keys(CLIP_LIST).forEach(function(n){total++;jobs.push(loadGLB((CLIP_LIST[n].b6?B6:B3)+'clips/'+n+'.glb').then(function(g){CLIPS[n]=prepClip(n,g,CLIP_LIST[n]);tick();},function(e){if(CLIP_LIST[n].b6){tick();return;}throw e;}));});
  ['j3','j5','j7'].forEach(function(id){total++;jobs.push(Promise.all([loadGLB(B3+id+'_half.glb'),loadTex(B3+id+'_mask.png'),loadGLB(B6+id+'_light.glb')]).then(function(r){
    var mat=null;r[0].scene.traverse(function(o){if(o.isMesh&&!mat)mat=o.material;});SRC[id]={full:r[0].scene,mask:r[1],light:r[2].scene,mat:mat};tick();}));});
  return Promise.all(jobs).then(function(){var BODY=['j3','j5','j7','j7','j5','j3'];
    for(var t=0;t<2;t++)for(var i=0;i<6;i++){var s=SRC[BODY[i]],kit=t===0?CFG.kitUs:CFG.kitRival,a=new Avatar(t,i);
      a.addBody('full',T3.cloneSkinned(s.full),s.mask,kit,s.mat);a.addBody('light',T3.cloneSkinned(s.light),s.mask,kit,s.mat);a.use('full');TEAM[t].pl[i]=a;}});}
var PRMAX=Math.min(window.devicePixelRatio||1,2);PR=PRMAX;
hudStatic();size();requestAnimationFrame(frame);
cargar().then(function(){ALL=TEAM[0].pl.concat(TEAM[1].pl);labelsMake();applyQ();$('load').style.display='none';
  G={phase:'menu',tPh:0,serving:0};R={mode:['def','def'],F:null,next:null};setGoals();
  for(var i=0;i<ALL.length;i++){var p=ALL[i];p.x=p.gx;p.z=p.gz;p.fn=0;}
  ball.position.set(0.6,BALL_R,3.2);ready=true;menu();window.BB_READY=true;
},function(e){if(window.console)console.error(e);$('load').textContent=L('No se pudo cargar el juego. Revisa tu conexión y ábrelo otra vez.','Could not load the game. Check your connection and open it again.');});

/* ganchos de prueba (robot que juega solo, para medir rallies y balance) */
window.BB={version:APP_VERSION,render:function(v){NOREND=!v;},net:NET,nLobby:function(){nLobby();},nCreate:function(c){nCreate(c);},nJoin:function(c){nJoin(c);},cam:function(a){CAMDBG=a||null;},hold:function(v){HOLD=!!v;last=performance.now();},adv:function(sec){var n=Math.max(1,Math.round(sec*60));for(var i=0;i<n;i++){var rdt=1/60;freezeT=0;if(TUT.hold){if(TUT.hold==='cho'&&(Math.abs(JX)>0.35||Math.abs(JZ)>0.35))tutRelease();}else tutCheck();if(TUT.hold){hudFrame(rdt);continue;}TS+=(tsGoal-TS)*Math.min(1,rdt*14);step(rdt*TS,rdt);camUpdate(rdt,false);hudFrame(rdt);crowdFrame(rdt);}return ctxNow();},joy:function(x,z){JX=x;JZ=z;},state:function(){return {G:G,R:R,CTRL:CTRL,tG:tG,TS:TS,REP:REP};},bot:BOT,press:function(){actionPress();},
  start:function(diff,assist,tut){if(diff)PREF.diff=diff;PREF.assist=!!assist;ov.style.display='none';newMatch(!!tut);},tut:function(){return TUT;},
  sim:function(matches,diff,sd,skip,aim,assist,react){var out={wins:0,losses:0,rallies:0,contacts:0,pts:[0,0],secs:0,st:{a:0,b:0,c:0,d:0,att:0,kill:0,attErr:0,blocked:0,ace:0,blk:0,srvErr:0,aiAtt:0,aiKill:0,aiErr:0,dive:0,aiDive:0},hist:{}};BOT.react=react||0;
    PREF.diff=diff||'easy';PREF.assist=!!assist;BOT.on=true;BOT.sim=true;BOT.sd=sd==null?0.05:sd;BOT.skip=skip||0;BOT.aim=aim||'open';BOT.log=[];var snd=PREF.snd;PREF.snd=false;
    for(var m=0;m<matches;m++){newMatch(false);var t0=tG,guard=0;while(G.phase!=='end'&&guard<400000){freezeT=0;step(1/60,1/60);guard++;}
      if(G.sc[0]>G.sc[1])out.wins++;else out.losses++;out.pts[0]+=G.sc[0];out.pts[1]+=G.sc[1];out.secs+=tG-t0;out.rallies+=G.st.rallies;out.contacts+=G.st.contacts;for(var k in out.st)out.st[k]+=G.st[k];}
    BOT.log.forEach(function(c){var b=c>=8?'8+':(''+c);out.hist[b]=(out.hist[b]||0)+1;});
    BOT.on=false;BOT.sim=false;PREF.snd=snd;out.avgContacts=out.contacts/Math.max(1,out.rallies);out.avgSecs=out.secs/matches;menu();return out;}};
})();
