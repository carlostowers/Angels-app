(function(){

    g.fillStyle='rgba(242,239,232,0.35)';g.font='800 '+(0.7*s)+'px Archivo, sans-serif';g.fillText(CFG.team.toUpperCase(),ox+4.5*s,oy+20.4*s);g.save();g.translate(ox+4.5*s,oy-2.4*s);g.rotate(Math.PI);g.fillText(CFG.team.toUpperCase(),0,0);g.restore();
  });

  /* gradas en cuatro lados: cinco niveles con publico */
  function rowTex(seed){return canvasTex(1024,96,function(g,w,h){g.clearRect(0,0,w,h);var skin=['#e8c3a0','#d6a67c','#bf8a60','#edd0b6','#cf9a6c'],shirt=['#2c3446','#3b4458','#4d576e','#6f7a92','#232a3a','#aeb6c6','#8f97a8',CFG.acc,'#2f5fc0','#c85a8e'];

      for(var x=16;x<w;x+=30){var jx=x+(rn()*8-4),up=rn()<0.22,sc=shirt[(rn()*(rn()<0.22?10:7))|0],yy=up?-6:0;

        g.fillStyle=skin[(rn()*5)|0];g.beginPath();g.arc(jx,44+yy,8,0,7);g.fill();g.fillStyle=['#1a1410','#2b2018','#3a2a1c','#0f0f12'][(rn()*4)|0];g.beginPath();g.arc(jx,41+yy,8.3,Math.PI*1.05,Math.PI*1.95);g.fill();}
      var gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(8,10,16,0)');gr.addColorStop(1,'rgba(8,10,16,0.55)');g.globalCompositeOperation='source-atop';g.fillStyle=gr;g.fillRect(0,0,w,h);g.globalCompositeOperation='source-over';});}
  var rows=[rowTex(3),rowTex(11),rowTex(29)];rows.forEach(function(t){t.wrapS=1000;});
  var seatM=new THREE.MeshBasicMaterial({color:'#0f1420'}),stepM=new THREE.MeshBasicMaterial({color:'#161d2c'});
  function stand(cx,cz,rot,len,n){var g=new THREE.Group();g.position.set(cx,0,cz);g.rotation.y=rot;scene.add(g);
    for(var k=0;k<n;k++){var base=new THREE.Mesh(new THREE.BoxGeometry(len,1.0+k*1.0,1.5),k%2?seatM:stepM);base.position.set(0,(1.0+k*1.0)/2,-k*1.5);g.add(base);

  if(p.low){clipPose(CLIPS.espera_defensa,0.25,poseIdle);poseIdle.hy=Math.min(poseIdle.hy,1);}
  else clipPose(CLIPS.espera,0.06+0.44*(0.5-0.5*Math.cos(tAll*0.45+p.seed)),poseIdle);
  poseIdle.hy+=Math.sin(tAll*1.65+p.seed)*0.002;
  if(spd>0.05){var fy=p.yaw,lf=p.vx*Math.cos(fy)-p.vz*Math.sin(fy),lfw=p.vx*Math.sin(fy)+p.vz*Math.cos(fy);

    var ph=((p.dist/segLen)%1+1)%1;clipPose(cl,a0+(a1-a0)*ph,poseMove);

    var wl=Math.abs(lf)/(Math.abs(lf)+Math.abs(lfw)+1e-6);blendPose(poseMoveF,poseMove,wl,poseG);

  if(p.act){var A=p.act,c=A.clip,tl=tG-A.tC,u=A.mark+tl*A.rate/c.dur,w=clamp((tl+A.lead)/A.fin,0,1)*clamp(1-(tl-A.tail)/A.fout,0,1);w=w*w*(3-2*w);

    if(tl>A.tail+A.fout)p.act=null;}

function stepPlayer(p,dt){var dvx=0,dvz=0,snap=false;
  if(p.glide){var tl=p.glide.t-tG;if(tl<=0.004){p.glide=null;}else{dvx=(p.glide.x-p.x)/tl;dvz=(p.glide.z-p.z)/tl;var gs=hyp(dvx,dvz),gm=p.glide.v||8.5;if(gs>gm){dvx*=gm/gs;dvz*=gm/gs;}snap=true;}}
  else if(tG<p.lock){}
  else{var gx=p.gx-p.x,gz=p.gz-p.z,gd=hyp(gx,gz);if(gd>0.03){var sp=Math.min(p.maxV,gd*7);dvx=gx/gd*sp;dvz=gz/gd*sp;}}
  var k=snap?1:Math.min(1,dt*13);p.vx=lerp(p.vx,dvx,k);p.vz=lerp(p.vz,dvz,k);p.x+=p.vx*dt;p.z+=p.vz*dt;
  p.dist+=hyp(p.vx,p.vz)*dt;
  var yt=(p.fn>tG)?(p.s>0?Math.PI:0):Math.atan2(ball.position.x-p.x,ball.position.z-p.z);p.yaw+=wrapPi(yt-p.yaw)*Math.min(1,dt*9);
  p.root.position.set(p.x,p.air,p.z);p.root.rotation.y=p.yaw;}

function step(dt,rdt){tG+=dt;tAll+=rdt;FRAME++;var u=tG-CY.t0,i,p;
  while(CY.ei<CY.ev.length&&u>=CY.ev[CY.ei].t){var e=CY.ev[CY.ei++];try{e.fn();}catch(er){if(window.console)console.error(er);}}

var BN={i:0,res:[]},MEAS={n:0,sum:0,buf:new Float32Array(4000),bad:false};
function measReset(){MEAS.n=0;MEAS.sum=0;MEAS.bad=false;}
function measAdd(ms){if(ms>1000){MEAS.bad=true;return;}if(MEAS.n<MEAS.buf.length){MEAS.buf[MEAS.n++]=ms;MEAS.sum+=ms;}}
function measEnd(){var n=MEAS.n,avg=0,low=0;
  if(n>4){avg=1000*n/MEAS.sum;var a=Array.prototype.slice.call(MEAS.buf,0,n);a.sort(function(x,y){return x-y;});var p95=a[Math.min(n-1,Math.floor(n*0.95))];low=1000/Math.max(1,p95);}
  var tri=0,calls=0;try{tri=renderer.info.render.triangles;calls=renderer.info.render.calls;}catch(e){}
  BN.res.push({k:CFGS[BN.i].k,avg:avg,low:low,n:n,tri:tri,calls:calls,bad:MEAS.bad});measReset();}

function good(r){return r.avg>=50&&r.low>=40;}
function verdict(res){var i,best=0;for(i=0;i<res.length;i++){if(res[i].avg>res[best].avg)best=i;}
  if(good(res[0]))return {i:0,c:'ok',t:L('Este celular corre el 6x6 completo.','This phone runs full 6v6.')};
  for(i=1;i<4;i++){if(good(res[i]))return {i:i,c:'ok',t:L('Este celular corre bien el 6x6 con el ajuste ','This phone runs 6v6 well with setting ')+res[i].k+'.'};}
  if(good(res[4]))return {i:4,c:'mid',t:L('Solo corre bien con todo liviano y sin sombras.','It only runs well with everything light and no shadows.')};
  var flat=true;for(i=0;i<res.length;i++){if(res[i].avg<27||res[i].avg>32)flat=false;}
  if(flat)return {i:0,c:'mid',t:L('Corre a 30 cuadros por segundo en todos los pasos. Casi seguro está en modo de bajo consumo: apágalo y repite la prueba.','It runs at 30 fps in every step. Low power mode is almost surely on: turn it off and run the test again.')};
  if(res[best].avg>=28)return {i:best,c:'mid',t:L('Corre a unos ','It runs at about ')+Math.round(res[best].avg)+L(' cuadros por segundo. Se puede jugar, pero no va fluido.',' fps. Playable, but not smooth.')};
  return {i:best,c:'bad',t:L('Este celular no llega a 30 cuadros por segundo con 12 jugadores.','This phone does not reach 30 fps with 12 players.')};}

  ov.style.display='flex';tap($('iGo'),function(){startTest();});tap($('iDemo'),function(){startDemo();});hudStatic();}catch(e){if(window.console)console.error(e);}}
function nf(v){try{return Math.round(v).toLocaleString('en-US');}catch(e){return ''+Math.round(v);}}
function resultCard(){try{var r=BN.res,v=BN.v,d=devInfo(),h='',i,bad=false;
  for(i=0;i<r.length;i++){var c=r[i].avg>=50?'ok':(r[i].avg>=28?'mid':'bad');if(r[i].bad)bad=true;
    h+='<tr'+(i===v.i?' class="pick"':'')+'><td><b>'+r[i].k+'</b> · '+L(CFGS[i].es,CFGS[i].en)+'</td><td class="n '+c+'">'+Math.round(r[i].avg)+'</td><td class="n">'+Math.round(r[i].low)+'</td><td class="n">'+nf(r[i].tri)+'</td></tr>';}
  ov.innerHTML='<div class="card"><h2>'+L('Resultado de la prueba','Test result')+'</h2><div class="verd '+v.c+'">'+v.t+'</div>'+
    (bad?'<p class="sub">'+L('Hubo una pausa larga durante la prueba. Conviene repetirla.','There was a long pause during the test. Better to run it again.')+'</p>':'')+
    '<table class="res"><tr><th>'+L('Ajuste','Setting')+'</th><th class="n">'+L('Cuadros por segundo','Frames per second')+'</th><th class="n">'+L('Mínimo','Low')+'</th><th class="n">'+L('Triángulos','Triangles')+'</th></tr>'+h+'</table>'+
    '<div class="dev">'+d.ua+' · '+d.scr+(d.mem?' · '+d.mem:'')+' · '+d.gpu+'</div>'+
    '<button class="btn" id="rSend" type="button">'+L('Enviar resultado','Send result')+'</button><button class="btn b2" id="rCopy" type="button">'+L('Copiar','Copy')+'</button><button class="btn b2" id="rAgain" type="button">'+L('Repetir','Run again')+'</button><button class="btn b2" id="rDemo" type="button">'+L('Ver la demostración','Watch the demo')+'</button>'+foot()+'</div>';
  ov.style.display='flex';tap($('rSend'),function(){doShare();});tap($('rCopy'),function(){doCopy();});tap($('rAgain'),function(){startTest();});tap($('rDemo'),function(){startDemo();});hudStatic();}catch(e){if(window.console)console.error(e);}}
function hudStatic(){try{var r=PB[CY.rot],t=MODE==='test',dm=MODE==='demo';
  $('rtn').style.display=(t||dm)?'flex':'none';$('rtn').innerHTML='<b>'+r.id+'</b><span>'+L(r.es,r.en)+'</span>';
  $('stp').style.display=(t||dm)?'block':'none';
  $('stp').textContent=t?(L('Paso ','Step ')+(BN.i+1)+L(' de ',' of ')+CFGS.length+' · '+L('ajuste ','setting ')+CFGS[CUR].k):(L('Ajuste ','Setting ')+CFGS[CUR].k);
  $('dsc').style.display=(t||dm)?'block':'none';$('dsc').textContent=L(CFGS[CUR].es,CFGS[CUR].en);if(!fpsV)$('fps').textContent=L('Midiendo…','Measuring…');
  $('bar').style.display=t?'block':'none';$('bCfg').style.display=dm?'block':'none';$('bRun').style.display=dm?'block':'none';$('fps').style.display=(t||dm)?'block':'none';
  $('bCfg').textContent=L('Cambiar ajuste','Change setting');$('bRun').textContent=L('Hacer la prueba','Run the test');}catch(e){}}
var fpsV=0;
function hudFps(){try{$('fps').textContent=fpsV+L(' cuadros por segundo',' fps')+' · '+nf(renderer.info.render.triangles)+L(' triángulos',' triangles');
  if(MODE==='test')$('barI').style.width=clamp((BN.i+clamp((tG-CY.t0)/CY.len,0,1))*100/CFGS.length,0,100).toFixed(1)+'%';}catch(e){}}
/* rol sobre cada jugador nuestro */
var LBL=[],_pv=new V3();
function mkLabels(){try{var box=$('lbl');for(var i=0;i<ROLES.length;i++){var k=ROLES[i],d=document.createElement('div');d.className='rl'+(k==='L'?' lib':'');d.textContent=k;box.appendChild(d);LBL.push({el:d,p:US[k]});}}catch(e){}}
function labels(){try{for(var i=0;i<LBL.length;i++){var o=LBL[i],p=o.p;_pv.set(p.x,1.98+p.air,p.z).project(camera);if(_pv.z>1){o.el.style.transform='translate(-999px,-999px)';continue;}
  o.el.style.transform='translate('+((_pv.x*0.5+0.5)*appW).toFixed(1)+'px,'+((-_pv.y*0.5+0.5)*appH).toFixed(1)+'px) translate(-50%,-100%)';}}catch(e){}}
tap($('bCfg'),function(){if(MODE==='demo')setCfg((CUR+1)%CFGS.length);});
tap($('bRun'),function(){if(MODE==='demo')startTest();});
document.addEventListener('touchmove',function(ev){try{if(ov.style.display==='flex'&&ov.contains(ev.target))return;if(ev.cancelable)ev.preventDefault();}catch(e){}},{passive:false});
document.addEventListener('gesturestart',function(ev){try{ev.preventDefault();}catch(e){}});
document.addEventListener('contextmenu',function(ev){try{ev.preventDefault();}catch(e){}});
document.addEventListener('visibilitychange',function(){try{if(document.hidden){if(MODE==='test')intro(L('La prueba se interrumpió. Empieza otra vez.','The test was interrupted. Start again.'));}else last=performance.now();}catch(e){}});

/* ======================= 6x6: TAMANO Y CAMARA ======================= */
var appW=800,appH=400,SROT=false,PR=Math.min(window.devicePixelRatio||1,2),baseFov=45;
function size(){try{var W=window.innerWidth,H=window.innerHeight;SROT=H>W;appW=SROT?H:W;appH=SROT?W:H;
  app.style.width=appW+'px';app.style.height=appH+'px';app.style.transform=SROT?'translate('+W+'px,0px) rotate(90deg)':'none';app.className=SROT?'rot':'';
  try{var cs=getComputedStyle($('safe')),it=parseFloat(cs.paddingTop)||0,ib=parseFloat(cs.paddingBottom)||0,il=parseFloat(cs.paddingLeft)||0,ir=parseFloat(cs.paddingRight)||0;
    app.style.setProperty('--sl',(SROT?it:il)+'px');app.style.setProperty('--sr',(SROT?ib:ir)+'px');}catch(e){}
  renderer.setPixelRatio(PR);renderer.setSize(appW,appH,true);var asp=appW/appH;camera.aspect=asp;
  /* mismo ancho de cancha en cualquier pantalla: el campo horizontal manda */
  var hf=2*Math.atan(Math.tan(47*Math.PI/360)*2.05);baseFov=clamp(2*Math.atan(Math.tan(hf/2)/asp)*180/Math.PI,40,64);camera.fov=baseFov;camera.updateProjectionMatrix();}catch(e){if(window.console)console.error(e);}}
/* camara de transmision desde nuestro fondo: abierta para ver a los doce (es el caso mas pesado) */
var CAMP=new V3(0,5.8,14.5),CAML=new V3(0,1.1,-1.2);
function camUpdate(rdt){var b=ball.position,k=1-Math.exp(-rdt*3);CAMP.x+=(b.x*0.14-CAMP.x)*k;CAML.x+=(b.x*0.32-CAML.x)*k;camera.position.copy(CAMP);camera.lookAt(CAML);}
window.addEventListener('resize',function(){size();});
function remide(){try{var W=window.innerWidth,H=window.innerHeight,r=H>W;if(r!==SROT||(r?H:W)!==appW||(r?W:H)!==appH)size();}catch(e){}}
window.addEventListener('pageshow',function(){remide();setTimeout(remide,300);setTimeout(remide,1200);});
window.addEventListener('load',function(){setTimeout(remide,200);});
window.addEventListener('orientationchange',function(){setTimeout(function(){size();},250);});
try{if(window.visualViewport)window.visualViewport.addEventListener('resize',remide);}catch(e){}
/* si el celular corta la grafica, se avisa y se recarga con un toque */
cv.addEventListener('webglcontextlost',function(ev){try{ev.preventDefault();paused=true;wake(false);
  ov.innerHTML='<div class="card" style="max-width:380px;text-align:center"><h2>'+L('Se detuvo la prueba','The test stopped')+'</h2><p>'+L('El celular cerró los gráficos. Toca para volver a cargar.','Your phone closed the graphics. Tap to reload.')+'</p><button class="btn" id="rel" type="button">'+L('Volver a cargar','Reload')+'</button>'+foot()+'</div>';ov.style.display='flex';
  tap($('rel'),function(){try{location.reload();}catch(e){}});}catch(e){}},false);

/* ======================= 6x6: CUADRO ======================= */
var last=performance.now(),fAcc=0,fN=0;
function frame(now){var raw=now-last;last=now;var rdt=Math.min(0.05,Math.max(0,raw/1000));
  try{if(ready&&!paused){step(rdt,rdt);camUpdate(rdt);crowdFrame(rdt);
      if(MODE==='test'&&(tG-CY.t0)>=WARM)measAdd(raw);
      fAcc+=raw;fN++;if(fN>=30){fpsV=Math.round(1000*fN/Math.max(1,fAcc));fAcc=0;fN=0;hudFps();}}
    renderer.render(scene,camera);}catch(e){if(window.console)console.error(e);}
  requestAnimationFrame(frame);}

/* ======================= 6x6: CARGA ======================= */
var B3='/juegos/bareboru/3d/',B6='/juegos/bareboru6/3d/';
function cargar(){var jobs=[],done=0,total=0;
  function tick(){done++;try{$('load').textContent=L('Cargando la cancha… ','Loading the court… ')+Math.round(done*100/total)+'%';}catch(e){}}
  Object.keys(CLIP_LIST).forEach(function(n){total++;jobs.push(loadGLB(B3+'clips/'+n+'.glb').then(function(g){CLIPS[n]=prepClip(n,g,CLIP_LIST[n]);tick();}));});
  ['j3','j5','j7'].forEach(function(id){total++;jobs.push(Promise.all([loadGLB(B3+id+'_half.glb'),loadTex(B3+id+'_mask.png'),loadGLB(B6+id+'_light.glb')]).then(function(r){
    var mat=null;r[0].scene.traverse(function(o){if(o.isMesh&&!mat)mat=o.material;});SRC[id]={full:r[0].scene,mask:r[1],light:r[2].scene,mat:mat};tick();}));});
  return Promise.all(jobs);}
function mkAvatar(team,idx,role,id,kit){var s=SRC[id],a=new Avatar(team,idx,role);
  a.addBody('full',T3.cloneSkinned(s.full),s.mask,kit,s.mat);a.addBody('light',T3.cloneSkinned(s.light),s.mask,kit,s.mat);a.use('full');return a;}
size();requestAnimationFrame(frame);
cargar().then(function(){try{var i;
  for(i=0;i<ROLES.length;i++){var k=ROLES[i];US[k]=mkAvatar(0,i,k,BODY_US[k],k==='L'?CFG.kitLib:CFG.kitUs);ALL.push(US[k]);}
  for(i=0;i<6;i++){RV[i]=mkAvatar(1,i,'R'+i,BODY_RV[i],i===5?CFG.kitRivalLib:CFG.kitRival);ALL.push(RV[i]);}
  mkLabels();setCfg(0);startCycle(true);drawScore(0,0,1);$('load').style.display='none';ready=true;last=performance.now();intro();window.BB6_READY=true;
  }catch(e){if(window.console)console.error(e);try{$('load').textContent=L('No se pudo armar la prueba. Ábrela otra vez.','Could not set up the test. Open it again.');}catch(e2){}}},
  function(e){if(window.console)console.error(e);try{$('load').textContent=L('No se pudo cargar la prueba. Revisa tu conexión y ábrela otra vez.','Could not load the test. Check your connection and open it again.');}catch(e2){}});

/* ganchos de prueba */
window.BB6={version:APP_VERSION,state:function(){return {mode:MODE,cur:CUR,rot:CY.rot,res:BN.res,v:BN.v,tG:tG,n:ALL.length};},start:function(){startTest();},demo:function(){startDemo();},cfg:function(i){setCfg(i);},rot:function(i){CY.rot=i;startCycle(true);},
  adv:function(sec,fake){var n=Math.max(1,Math.round(sec*60));for(var i=0;i<n;i++){step(1/60,1/60);if(MODE==='test'&&(tG-CY.t0)>=WARM)measAdd(fake||16.7);}return tG-CY.t0;},text:function(){return shareText();},hold:function(v){paused=!!v;last=performance.now();},cam:function(a){CAMP.set(a[0],a[1],a[2]);CAML.set(a[3],a[4],a[5]);camera.position.copy(CAMP);camera.lookAt(CAML);}};
})();
</script>
</body>
</html>
